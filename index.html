    // =================================
    // STANDALONE PURE-JS QR CODE ENGINE
    // =================================
    const QRMath = {
      glog: n => { if (n < 1) throw new Error("glog"); return QRMath.LOG_TABLE[n]; },
      gexp: n => { while (n < 0) n += 255; while (n >= 255) n -= 255; return QRMath.EXP_TABLE[n]; },
      EXP_TABLE: new Array(256),
      LOG_TABLE: new Array(256)
    };
    for (let i = 0; i < 8; i++) QRMath.EXP_TABLE[i] = 1 << i;
    for (let i = 8; i < 256; i++) QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4] ^ QRMath.EXP_TABLE[i - 5] ^ QRMath.EXP_TABLE[i - 6] ^ QRMath.EXP_TABLE[i - 8];
    for (let i = 0; i < 255; i++) QRMath.LOG_TABLE[QRMath.EXP_TABLE[i]] = i;

    function QRPolynomial(num, shift) {
      let offset = 0;
      while (offset < num.length && num[offset] === 0) offset++;
      this.num = new Array(num.length - offset + shift);
      for (let i = 0; i < num.length - offset; i++) this.num[i] = num[i + offset];
      for (let i = 0; i < shift; i++) this.num[num.length - offset + i] = 0;
    }
    QRPolynomial.prototype = {
      get: function(index) { return this.num[index]; },
      getLength: function() { return this.num.length; },
      multiply: function(e) {
        const num = new Array(this.getLength() + e.getLength() - 1).fill(0);
        for (let i = 0; i < this.getLength(); i++) {
          for (let j = 0; j < e.getLength(); j++) {
            num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i)) + QRMath.glog(e.get(j)));
          }
        }
        return new QRPolynomial(num, 0);
      },
      mod: function(e) {
        if (this.getLength() - e.getLength() < 0) return this;
        const ratio = QRMath.glog(this.get(0)) - QRMath.glog(e.get(0));
        const num = new Array(this.getLength());
        for (let i = 0; i < this.getLength(); i++) num[i] = this.get(i);
        for (let i = 0; i < e.getLength(); i++) num[i] ^= QRMath.gexp(QRMath.glog(e.get(i)) + ratio);
        return new QRPolynomial(num, 0).mod(e);
      }
    };

    const QRRSBlock = {
      RS_BLOCK_TABLE: [
        [1, 26, 19], [1, 26, 16], [1, 26, 13], [1, 26, 9],
        [1, 44, 34], [1, 44, 28], [1, 44, 22], [1, 44, 16],
        [1, 70, 55], [1, 70, 44], [2, 35, 17], [2, 35, 13],
        [1, 100, 80], [2, 50, 32], [2, 50, 24], [4, 25, 9],
        [1, 134, 108], [2, 67, 43], [2, 33, 15, 2, 34, 16], [2, 33, 11, 2, 34, 12],
        [2, 86, 68], [4, 43, 27], [4, 43, 19], [4, 43, 15],
        [2, 98, 78], [4, 49, 31], [2, 32, 14, 4, 33, 15], [4, 39, 13, 1, 40, 14],
        [2, 121, 97], [2, 60, 38, 2, 61, 39], [4, 40, 18, 2, 41, 19], [4, 40, 14, 2, 41, 15],
        [2, 146, 116], [3, 58, 36, 2, 59, 37], [4, 36, 16, 4, 37, 17], [4, 36, 12, 4, 37, 13],
        [2, 86, 68, 2, 87, 69], [4, 69, 43, 1, 70, 44], [6, 43, 19, 2, 44, 20], [6, 43, 15, 2, 44, 16]
      ],
      getRSBlocks: function(typeNumber, errorCorrectLevel) {
        const rsBlock = QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + errorCorrectLevel];
        if (!rsBlock) throw new Error("Bad RS block");
        const length = rsBlock.length / 3;
        const list = [];
        for (let i = 0; i < length; i++) {
          const count = rsBlock[i * 3 + 0];
          const totalCount = rsBlock[i * 3 + 1];
          const dataCount = rsBlock[i * 3 + 2];
          for (let j = 0; j < count; j++) list.push({ totalCount, dataCount });
        }
        return list;
      }
    };

    function QRBitBuffer() {
      this.buffer = [];
      this.length = 0;
    }
    QRBitBuffer.prototype = {
      get: function(index) {
        return ((this.buffer[Math.floor(index / 8)] >>> (7 - index % 8)) & 1) === 1;
      },
      put: function(num, length) {
        for (let i = 0; i < length; i++) this.putBit(((num >>> (length - i - 1)) & 1) === 1);
      },
      putBit: function(bit) {
        const bufIndex = Math.floor(this.length / 8);
        if (this.buffer.length <= bufIndex) this.buffer.push(0);
        if (bit) this.buffer[bufIndex] |= (0x80 >>> (this.length % 8));
        this.length++;
      }
    };

    const QRUtil = {
      PATTERN_POSITION_TABLE: [
        [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34],
        [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50]
      ],
      G15: (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
      G15_MASK: (1 << 14) | (1 << 12) | (1 << 10) | (1 << 4) | (1 << 1),
      getBCHTypeInfo: function(data) {
        let d = data << 10;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
          d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15)));
        }
        return ((data << 10) | d) ^ QRUtil.G15_MASK;
      },
      getBCHDigit: function(data) {
        let digit = 0;
        while (data !== 0) { digit++; data >>>= 1; }
        return digit;
      },
      getPatternPosition: function(typeNumber) {
        return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1] || [];
      },
      getMask: function(maskPattern, i, j) {
        switch (maskPattern) {
          case 0: return (i + j) % 2 === 0;
          case 1: return i % 2 === 0;
          case 2: return j % 3 === 0;
          case 3: return (i + j) % 3 === 0;
          case 4: return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 === 0;
          case 5: return (i * j) % 2 + (i * j) % 3 === 0;
          case 6: return ((i * j) % 2 + (i * j) % 3) % 2 === 0;
          case 7: return ((i * j) % 3 + (i + j) % 2) === 0;
          default: return false;
        }
      },
      getErrorCorrectPolynomial: function(errorCorrectLength) {
        let a = new QRPolynomial([1], 0);
        for (let i = 0; i < errorCorrectLength; i++) {
          a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0));
        }
        return a;
      },
      getLostPoint: function(qrCode) {
        const moduleCount = qrCode.getModuleCount();
        let lostPoint = 0;
        for (let row = 0; row < moduleCount; row++) {
          for (let col = 0; col < moduleCount; col++) {
            let sameCount = 0;
            const dark = qrCode.isDark(row, col);
            for (let r = -1; r <= 1; r++) {
              if (row + r < 0 || moduleCount <= row + r) continue;
              for (let c = -1; c <= 1; c++) {
                if (col + c < 0 || moduleCount <= col + c) continue;
                if (r === 0 && c === 0) continue;
                if (dark === qrCode.isDark(row + r, col + c)) sameCount++;
              }
            }
            if (sameCount > 5) lostPoint += (3 + sameCount - 5);
          }
        }
        return lostPoint;
      }
    };

    function QRCodeModel(typeNumber, errorCorrectLevel) {
      this.typeNumber = typeNumber || 0;
      this.errorCorrectLevel = errorCorrectLevel !== undefined ? errorCorrectLevel : 1; // 1: Level L, 0: Level M
      this.modules = null;
      this.moduleCount = 0;
      this.dataList = [];
    }
    QRCodeModel.prototype = {
      addData: function(data) {
        this.dataList.push(data);
      },
      isDark: function(row, col) {
        return this.modules[row][col] === true;
      },
      getModuleCount: function() { return this.moduleCount; },
      make: function() {
        if (this.typeNumber < 1) {
          let typeNumber = 1;
          for (typeNumber = 1; typeNumber <= 10; typeNumber++) {
            const rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);
            let totalDataCount = 0;
            for (let i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
            let len = 0;
            for (let i = 0; i < this.dataList.length; i++) {
              const str = this.dataList[i];
              len += 4 + 8 + (str.length * 8);
            }
            if (len <= totalDataCount * 8) break;
          }
          this.typeNumber = Math.min(10, typeNumber);
        }
        this.makeImpl(false, this.getBestMaskPattern());
      },
      makeImpl: function(test, maskPattern) {
        this.moduleCount = this.typeNumber * 4 + 17;
        this.modules = new Array(this.moduleCount);
        for (let row = 0; row < this.moduleCount; row++) {
          this.modules[row] = new Array(this.moduleCount).fill(null);
        }
        this.setupPositionProbePattern(0, 0);
        this.setupPositionProbePattern(this.moduleCount - 7, 0);
        this.setupPositionProbePattern(0, this.moduleCount - 7);
        this.setupPositionAdjustPattern();
        this.setupTimingPattern();
        this.setupTypeInfo(test, maskPattern);
        const data = this.createData();

      },
      setupPositionProbePattern: function(row, col) {
        for (let r = -1; r <= 7; r++) {
          if (row + r <= -1 || this.moduleCount <= row + r) continue;
          for (let c = -1; c <= 7; c++) {
            if (col + c <= -1 || this.moduleCount <= col + c) continue;
            if ((0 <= r && r <= 6 && (c === 0 || c === 6)) ||
                (0 <= c && c <= 6 && (r === 0 || r === 6)) ||
                (2 <= r && r <= 4 && 2 <= c && c <= 4)) {
              this.modules[row + r][col + c] = true;
            } else {
              this.modules[row + r][col + c] = false;
            }
          }
        }
      },
      getBestMaskPattern: function() {
        let minLostPoint = 0;
        let pattern = 0;
        for (let i = 0; i < 8; i++) {
          this.makeImpl(true, i);
          const lostPoint = QRUtil.getLostPoint(this);
          if (i === 0 || minLostPoint > lostPoint) {
            minLostPoint = lostPoint;
            pattern = i;
          }
        }
        return pattern;
      },
      setupTimingPattern: function() {
        for (let r = 8; r < this.moduleCount - 8; r++) {
          if (this.modules[r][6] !== null) continue;
          this.modules[r][6] = (r % 2 === 0);
        }
        for (let c = 8; c < this.moduleCount - 8; c++) {
          if (this.modules[6][c] !== null) continue;
          this.modules[6][c] = (c % 2 === 0);
        }
      },
      setupPositionAdjustPattern: function() {
        const pos = QRUtil.getPatternPosition(this.typeNumber);
        for (let i = 0; i < pos.length; i++) {
          for (let j = 0; j < pos.length; j++) {
            const row = pos[i];
            const col = pos[j];
            if (this.modules[row][col] !== null) continue;
            for (let r = -2; r <= 2; r++) {
              for (let c = -2; c <= 2; c++) {
                if (r === -2 || r === 2 || c === -2 || c === 2 || (r === 0 && c === 0)) {
                  this.modules[row + r][col + c] = true;
                } else {
                  this.modules[row + r][col + c] = false;
                }
              }
            }
          }
        }
      },
      setupTypeInfo: function(test, maskPattern) {
        const data = (this.errorCorrectLevel << 3) | maskPattern;
        const bits = QRUtil.getBCHTypeInfo(data);
        for (let i = 0; i < 15; i++) {
          const mod = (!test && ((bits >> i) & 1) === 1);
          if (i < 6) this.modules[i][8] = mod;
          else if (i < 8) this.modules[i + 1][8] = mod;
          else this.modules[this.moduleCount - 15 + i][8] = mod;
        }
        for (let i = 0; i < 15; i++) {
          const mod = (!test && ((bits >> i) & 1) === 1);
          if (i < 8) this.modules[8][this.moduleCount - i - 1] = mod;
          else if (i < 9) this.modules[8][15 - i - 1 + 1] = mod;
          else this.modules[8][15 - i - 1] = mod;
        }
        this.modules[this.moduleCount - 8][8] = !test;
      },
      createData: function() {
        const rsBlocks = QRRSBlock.getRSBlocks(this.typeNumber, this.errorCorrectLevel);
        const buffer = new QRBitBuffer();
        for (let i = 0; i < this.dataList.length; i++) {
          const data = this.dataList[i];
          buffer.put(4, 4); // 8-bit byte mode
          buffer.put(data.length, 8);
          for (let j = 0; j < data.length; j++) buffer.put(data.charCodeAt(j), 8);
        }
        let totalDataCount = 0;
        for (let i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
        if (buffer.length + 4 <= totalDataCount * 8) buffer.put(0, 4);
        while (buffer.length % 8 !== 0) buffer.putBit(false);
        while (buffer.length < totalDataCount * 8) {
          buffer.put(0xEC, 8);
          if (buffer.length < totalDataCount * 8) buffer.put(0x11, 8);
        }
        return this.createBytes(buffer, rsBlocks);
      },
      createBytes: function(buffer, rsBlocks) {
        let offset = 0;
        let maxDcCount = 0;
        let maxEcCount = 0;
        const dcdata = new Array(rsBlocks.length);
        const ecdata = new Array(rsBlocks.length);
        for (let r = 0; r < rsBlocks.length; r++) {
          const dcCount = rsBlocks[r].dataCount;
          const ecCount = rsBlocks[r].totalCount - dcCount;
          maxDcCount = Math.max(maxDcCount, dcCount);
          maxEcCount = Math.max(maxEcCount, ecCount);
          dcdata[r] = new Array(dcCount);
          for (let i = 0; i < dcdata[r].length; i++) dcdata[r][i] = 0xff & buffer.buffer[i + offset];
          offset += dcCount;
          const rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
          const rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);
          const modPoly = rawPoly.mod(rsPoly);
          ecdata[r] = new Array(rsPoly.getLength() - 1);
          for (let i = 0; i < ecdata[r].length; i++) {
            const modIndex = i + modPoly.getLength() - ecdata[r].length;
            ecdata[r][i] = (modIndex >= 0) ? modPoly.get(modIndex) : 0;
          }
        }
        let totalCodeCount = 0;
        for (let i = 0; i < rsBlocks.length; i++) totalCodeCount += rsBlocks[i].totalCount;
        const data = new Array(totalCodeCount);
        let index = 0;
        for (let i = 0; i < maxDcCount; i++) {
          for (let r = 0; r < rsBlocks.length; r++) {
            if (i < dcdata[r].length) data[index++] = dcdata[r][i];
          }
        }
        for (let i = 0; i < maxEcCount; i++) {
          for (let r = 0; r < rsBlocks.length; r++) {
            if (i < ecdata[r].length) data[index++] = ecdata[r][i];
          }
        }
        return data;
      },
      mapData: function(data, maskPattern) {
        let inc = -1;
        let row = this.moduleCount - 1;
        let bitIndex = 7;
        let byteIndex = 0;
        for (let col = this.moduleCount - 1; col > 0; col -= 2) {
          if (col === 6) col--;
          while (true) {
            for (let c = 0; c < 2; c++) {
              if (this.modules[row][col - c] === null) {
                let dark = false;
                if (byteIndex < data.length) dark = (((data[byteIndex] >>> bitIndex) & 1) === 1);
                const mask = QRUtil.getMask(maskPattern, row, col - c);
                if (mask) dark = !dark;
                this.modules[row][col - c] = dark;
                bitIndex--;
                if (bitIndex === -1) {
                  byteIndex++;
                  bitIndex = 7;
                }
              }
            }
            row += inc;
            if (row < 0 || this.moduleCount <= row) {
              row -= inc;
              inc = -inc;
              break;
            }
          }
        }
      }
    };

    // GENERATOR PAYLOAD RESMI QRIS INDONESIA (EMVCo Standard)
    const generateQrisPayload = (nmid, merchantName, amount, invoice) => {
      const cleanNmid = (nmid || 'ID102030405060').replace(/[^a-zA-Z0-9]/g, '');
      const cleanName = (merchantName || 'WARUNG BERKAH').substring(0, 20).toUpperCase();
      const amtStr = Math.round(amount || 0).toString();
      const fTag = (id, val) => {
        const len = val.length < 10 ? '0' + val.length : '' + val.length;
        return id + len + val;
      };
      let raw = fTag('00', '01') +
                fTag('01', '12') + // Dynamic QRIS
                fTag('26', fTag('00', 'ID.CO.QRIS.WWW') + fTag('01', cleanNmid)) +
                fTag('52', '5411') + // Retail / Grocery Store
                fTag('53', '360') +  // Rupiah (IDR)
                fTag('54', amtStr) + // Exact Amount
                fTag('58', 'ID') +
                fTag('59', cleanName) +
                '6304';
      // CRC16-CCITT
      let crc = 0xFFFF;
      for (let i = 0; i < raw.length; i++) {
        crc ^= (raw.charCodeAt(i) << 8);
        for (let j = 0; j < 8; j++) {
          if ((crc & 0x8000) !== 0) crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
          else crc = (crc << 1) & 0xFFFF;
        }
      }
      let hex = (crc & 0xFFFF).toString(16).toUpperCase();
      while (hex.length < 4) hex = '0' + hex;
      return raw + hex;
    };

    // KOMPONEN RENDER QR CODE (Canvas Native - 100% Offline & Crisp)
    const QRCodeViewer = ({ value, size = 180, className = "" }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !value) return;
        try {
          const qr = new QRCodeModel(0, 1); // Auto version, Level L
          qr.addData(value);
          qr.make();
          const count = qr.getModuleCount();
          const canvas = canvasRef.current;
          canvas.width = size * 2; // Retina scale
          canvas.height = size * 2;
          const ctx = canvas.getContext('2d');
          ctx.scale(2, 2);

          // Clear White Canvas
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, size, size);

          const cellSize = size / (count + 2); // 1-cell quiet zone
          ctx.fillStyle = '#0f172a';
          for (let r = 0; r < count; r++) {
            for (let c = 0; c < count; c++) {
              if (qr.isDark(r, c)) {
                ctx.fillRect((c + 1) * cellSize, (r + 1) * cellSize, cellSize + 0.3, cellSize + 0.3);
              }
            }
          }
        } catch (err) {
          console.warn('Fallback QR rendering:', err);
        }
      }, [value, size]);

      return (
        <canvas
          ref={canvasRef}
          className={`rounded-xl shadow-xs border border-slate-200 bg-white ${className}`}
          style={{ width: size, height: size }}
        />
      );
    };

            const parsed = JSON.parse(saved);
            return {
              ...SEED_SETTINGS,
              ...parsed,
              bankAccounts: (parsed.bankAccounts && parsed.bankAccounts.length > 0) ? parsed.bankAccounts : SEED_SETTINGS.bankAccounts

            return SEED_SETTINGS;
          }

        return SEED_SETTINGS;

      // Notifications calculation
      const notifications = useMemo(() => {
        const list = [];
        products.filter(p => !p.isArchived).forEach(p => {
          if (p.stock === 0) {
            list.push({ id: `oos-${p.id}`, title: `Stok Habis: ${p.name}`, message: `Sisa stok 0 ${p.unit}. Segera kulakan!`, type: 'danger', link: 'products' });

                <div className="hidden lg:flex items-center text-xs text-slate-500 font-medium bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">
                  <span>{formatDateIndo(new Date().toISOString())}</span>
                </div>

                {/* NOTIFICATION BUTTON */}
                <button
                  onClick={() => setShowNotifications(true)}
                  className="relative p-2 text-slate-600 hover:text-emerald-600 hover:bg-emerald-50 rounded-xl transition"
                  title="Pusat Peringatan & Notifikasi"
                >
                  <Icon name="bell" className="w-5 h-5" />
                  {notifications.length > 0 && (
                    <span className="absolute top-1.5 right-1.5 flex h-4 w-4 items-center justify-center rounded-full bg-rose-500 text-[10px] font-bold text-white shadow-xs">
                      {notifications.length}
                    </span>
                  )}
                </button>

                {/* USER BADGE */}
                <div className="flex items-center gap-2 pl-2 border-l border-slate-200">
                  <div className="w-8 h-8 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs font-bold shadow-xs">
                    {currentUser.name.charAt(0)}
                  </div>
                  <div className="hidden sm:block text-left">
                    <p className="text-xs font-bold text-slate-800 leading-tight">{currentUser.name}</p>
                    <p className="text-[10px] text-slate-500">{currentUser.roleLabel}</p>
                  </div>
                </div>

                {/* LOGOUT BUTTON */}
                <button
                  onClick={handleLogout}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold text-rose-700 bg-rose-50 hover:bg-rose-100 transition border border-rose-200 shadow-xs ml-1"
                  title="Keluar dari akun"
                >
                  <Icon name="logout" className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Keluar</span>
                </button>
              </div>
            </header>

            {/* TAB CONTENTS */}
            <main className="flex-1 p-4 md:p-6 lg:p-8 max-w-7xl mx-auto w-full">
              {activeTab === 'dashboard' && (
                <DashboardView
                  products={products}
                  sales={sales}
                  purchases={purchases}
                  categories={categories}
                  categoryMap={categoryMap}
                  setActiveTab={setActiveTab}
                />
              )}

              {activeTab === 'pos' && (
                <PosView
                  products={products}
                  setProducts={setProducts}
                  sales={sales}
                  setSales={setSales}
                  movements={movements}
                  setMovements={setMovements}
                  categoryMap={categoryMap}
                  settings={settings}
                  currentUser={currentUser}
                  showToast={showToast}
                />
              )}

              {activeTab === 'products' && (
                <ProductsView
                  products={products}
                  setProducts={setProducts}
                  categories={categories}
                  suppliers={suppliers}
                  categoryMap={categoryMap}
                  supplierMap={supplierMap}
                  sales={sales}
                  purchases={purchases}
                  movements={movements}
                  setMovements={setMovements}
                  currentUser={currentUser}
                  showToast={showToast}
                />
              )}

              {activeTab === 'categories' && (
                <CategoriesView
                  categories={categories}
                  setCategories={setCategories}
                  products={products}
                  showToast={showToast}
                />
              )}

              {activeTab === 'purchases' && (
                <PurchasesView
                  purchases={purchases}
                  setPurchases={setPurchases}
                  products={products}
                  setProducts={setProducts}
                  suppliers={suppliers}
                  movements={movements}
                  setMovements={setMovements}
                  currentUser={currentUser}
                  showToast={showToast}
                />
              )}

              {activeTab === 'suppliers' && (
                <SuppliersView
                  suppliers={suppliers}
                  setSuppliers={setSuppliers}
                  products={products}
                  showToast={showToast}
                />
              )}

              {activeTab === 'opname' && (
                <StockOpnameView
                  products={products}
                  setProducts={setProducts}
                  opnames={opnames}
                  setOpnames={setOpnames}
                  movements={movements}
                  setMovements={setMovements}
                  currentUser={currentUser}
                  showToast={showToast}
                />
              )}

              {activeTab === 'movements' && (
                <MovementsView movements={movements} />
              )}

              {activeTab === 'reports' && (
                <ReportsView
                  sales={sales}
                  purchases={purchases}
                  products={products}
                  categoryMap={categoryMap}
                  opnames={opnames}
                />
              )}

              {activeTab === 'settings' && (
                <SettingsView
                  settings={settings}
                  setSettings={setSettings}
                  currentUser={currentUser}
                  setCurrentUser={setCurrentUser}
                  users={SEED_USERS}
                  onResetDemo={handleResetDemo}
                  showToast={showToast}
                />
              )}
            </main>
          </div>

          {/* NOTIFICATION MODAL */}
          {showNotifications && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200 animate-fadeIn">
                <div className="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                  <div className="flex items-center gap-2.5">
                    <div className="p-2 bg-emerald-100 text-emerald-700 rounded-lg">
                      <Icon name="bell" className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="font-bold text-slate-800 text-base">Pusat Peringatan Warung</h3>
                      <p className="text-xs text-slate-500">Peringatan otomatis stok & batas kedaluwarsa</p>
                    </div>
                  </div>
                  <button onClick={() => setShowNotifications(false)} className="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-4 max-h-96 overflow-y-auto space-y-2.5">
                  {notifications.length === 0 ? (
                    <div className="py-8 text-center text-slate-500">
                      <div className="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-2">
                        <Icon name="check" className="w-6 h-6" />
                      </div>
                      <p className="font-medium text-sm">Semua stok dalam kondisi aman!</p>
                      <p className="text-xs text-slate-400 mt-1">Tidak ada produk yang habis atau menipis saat ini.</p>
                    </div>
                  ) : (
                    notifications.map(n => (
                      <div
                        key={n.id}
                        onClick={() => {
                          setActiveTab(n.link);
                          setShowNotifications(false);
                        }}
                        className={`p-3.5 rounded-xl border text-left cursor-pointer transition hover:shadow-xs flex items-start gap-3 ${
                          n.type === 'danger'
                            ? 'bg-rose-50/60 border-rose-200 text-rose-900'
                            : 'bg-amber-50/60 border-amber-200 text-amber-900'
                        }`}
                      >
                        <div className={`p-1.5 rounded-lg flex-shrink-0 ${n.type === 'danger' ? 'bg-rose-200 text-rose-700' : 'bg-amber-200 text-amber-700'}`}>
                          <Icon name="alert" className="w-4 h-4" />
                        </div>
                        <div className="flex-1 min-w-0">
                          <p className="font-bold text-xs">{n.title}</p>
                          <p className="text-xs mt-0.5 opacity-90">{n.message}</p>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                <div className="p-3 border-t border-slate-100 bg-slate-50 flex justify-end">
                  <button
                    onClick={() => setShowNotifications(false)}
                    className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-xs font-semibold"
                  >
                    Tutup
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 1. DASHBOARD VIEW COMPONENT
    // ==========================================
    function DashboardView({ products, sales, purchases, categories, categoryMap, setActiveTab }) {
      const [filterPeriod, setFilterPeriod] = useState('today'); // today, week, month, all
      const [customStartDate, setCustomStartDate] = useState('');
      const [customEndDate, setCustomEndDate] = useState('');

      const activeProducts = products.filter(p => !p.isArchived);

      // Inventory Metrics
      const totalProductCount = activeProducts.length;
      const totalStockUnits = activeProducts.reduce((acc, p) => acc + p.stock, 0);
      const totalInventoryValue = activeProducts.reduce((acc, p) => acc + (p.stock * p.costPrice), 0);

      const lowStockProducts = activeProducts.filter(p => p.stock > 0 && p.stock <= p.minStock);
      const outOfStockProducts = activeProducts.filter(p => p.stock === 0);

      // Filtered Sales Logic
      const filteredSales = useMemo(() => {
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

        return sales.filter(s => {
          if (s.status === 'cancelled') return false;
          const sTime = new Date(s.date).getTime();

          if (filterPeriod === 'today') {
            return sTime >= startOfToday;
          } else if (filterPeriod === 'week') {
            const oneWeekAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
            return sTime >= oneWeekAgo;
          } else if (filterPeriod === 'month') {
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
            return sTime >= startOfMonth;
          } else if (filterPeriod === 'custom') {
            if (!customStartDate && !customEndDate) return true;
            const start = customStartDate ? new Date(customStartDate).getTime() : 0;
            const end = customEndDate ? new Date(customEndDate + 'T23:59:59').getTime() : Infinity;
            return sTime >= start && sTime <= end;
          }
          return true;
        });
      }, [sales, filterPeriod, customStartDate, customEndDate]);

      const salesRevenue = filteredSales.reduce((acc, s) => acc + s.total, 0);
      const salesCostHPP = filteredSales.reduce((acc, s) => {
        const cost = s.items.reduce((sum, item) => sum + (item.costPrice * item.quantity), 0);
        return acc + cost;
      }, 0);
      const grossProfit = salesRevenue - salesCostHPP;

      // Top Selling Products
      const topSellingProducts = useMemo(() => {
        const map = {};
        sales.filter(s => s.status === 'completed').forEach(s => {
          s.items.forEach(item => {
            if (!map[item.productId]) {
              map[item.productId] = {
                name: item.productName,
                sku: item.sku,
                unit: item.unit,
                qty: 0,
                revenue: 0,
              };
            }
            map[item.productId].qty += item.quantity;
            map[item.productId].revenue += item.subtotal;
          });
        });
        return Object.values(map).sort((a, b) => b.qty - a.qty).slice(0, 5);
      }, [sales]);

      // Daily trend data for visualization
      const trendData = useMemo(() => {
        const days = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const dateStr = d.toISOString().split('T')[0];
          const label = d.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric' });

          const daySales = sales.filter(s => s.status === 'completed' && s.date.startsWith(dateStr));
          const rev = daySales.reduce((acc, s) => acc + s.total, 0);
          const hpp = daySales.reduce((acc, s) => {
            return acc + s.items.reduce((sum, it) => sum + (it.costPrice * it.quantity), 0);
          }, 0);
          const profit = rev - hpp;

          days.push({ label, revenue: rev, profit: profit > 0 ? profit : 0 });
        }
        return days;
      }, [sales]);

      const maxTrendVal = Math.max(...trendData.map(t => t.revenue), 100000);

      return (
        <div className="space-y-6">
          {/* HEADER & FILTER BAR */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
            <div>
              <h2 className="text-xl font-extrabold text-slate-800 tracking-tight">Ringkasan Operasional Warung</h2>
              <p className="text-xs text-slate-500 mt-0.5">Pantau pendapatan, keuntungan kotor, dan ketersediaan stok barang Anda.</p>
            </div>

            {/* PERIOD FILTER */}
            <div className="flex flex-wrap items-center gap-2">
              <span className="text-xs font-semibold text-slate-500 mr-1">Periode:</span>
              {[
                { id: 'today', label: 'Hari Ini' },
                { id: 'week', label: '7 Hari' },
                { id: 'month', label: 'Bulan Ini' },
                { id: 'all', label: 'Semua' },
                { id: 'custom', label: 'Rentang Khusus' },
              ].map(p => (
                <button
                  key={p.id}
                  onClick={() => setFilterPeriod(p.id)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition ${
                    filterPeriod === p.id
                      ? 'bg-emerald-600 text-white shadow-xs'
                      : 'bg-slate-100 hover:bg-slate-200 text-slate-700'
                  }`}
                >
                  {p.label}
                </button>
              ))}
            </div>
          </div>

          {filterPeriod === 'custom' && (
            <div className="flex items-center gap-3 bg-white p-4 rounded-xl border border-slate-200">
              <span className="text-xs font-medium text-slate-600">Dari:</span>
              <input
                type="date"
                value={customStartDate}
                onChange={e => setCustomStartDate(e.target.value)}
                className="px-3 py-1.5 border border-slate-300 rounded-lg text-xs"
              />
              <span className="text-xs font-medium text-slate-600">Sampai:</span>
              <input
                type="date"
                value={customEndDate}
                onChange={e => setCustomEndDate(e.target.value)}
                className="px-3 py-1.5 border border-slate-300 rounded-lg text-xs"
              />
            </div>
          )}

          {/* STATS CARDS GRID */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            {/* CARD 1: OMZET PENJUALAN */}
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs hover:border-emerald-300 transition">
              <div className="flex items-center justify-between">
                <span className="text-xs font-semibold uppercase tracking-wider text-slate-500">Penjualan ({filterPeriod === 'today' ? 'Hari Ini' : 'Periode Terpilih'})</span>
                <div className="p-2 rounded-xl bg-emerald-50 text-emerald-600">
                  <Icon name="pos" className="w-5 h-5" />
                </div>
              </div>
              <p className="text-2xl font-black text-slate-800 mt-3">{formatRp(salesRevenue)}</p>
              <p className="text-xs text-slate-500 mt-1">{filteredSales.length} transaksi selesai</p>
            </div>

            {/* CARD 2: ESTIMASI KEUNTUNGAN KOTOR */}
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs hover:border-emerald-300 transition">
              <div className="flex items-center justify-between">
                <span className="text-xs font-semibold uppercase tracking-wider text-slate-500">Estimasi Keuntungan Kotor</span>
                <div className="p-2 rounded-xl bg-teal-50 text-teal-600">
                  <Icon name="report" className="w-5 h-5" />
                </div>
              </div>
              <p className="text-2xl font-black text-teal-700 mt-3">{formatRp(grossProfit)}</p>
              <p className="text-xs text-slate-500 mt-1">
                Margin kotor: {salesRevenue > 0 ? Math.round((grossProfit / salesRevenue) * 100) : 0}%
              </p>
            </div>

            {/* CARD 3: TOTAL NILAI PERSEDIAAN */}
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs hover:border-emerald-300 transition">
              <div className="flex items-center justify-between">
                <span className="text-xs font-semibold uppercase tracking-wider text-slate-500">Nilai Persediaan (Modal)</span>
                <div className="p-2 rounded-xl bg-blue-50 text-blue-600">
                  <Icon name="product" className="w-5 h-5" />
                </div>
              </div>
              <p className="text-2xl font-black text-slate-800 mt-3">{formatRp(totalInventoryValue)}</p>
              <p className="text-xs text-slate-500 mt-1">{totalStockUnits} total unit ({totalProductCount} jenis produk)</p>
            </div>

            {/* CARD 4: PERINGATAN STOK */}
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs hover:border-rose-300 transition">
              <div className="flex items-center justify-between">
                <span className="text-xs font-semibold uppercase tracking-wider text-slate-500">Perhatian Stok</span>
                <div className="p-2 rounded-xl bg-rose-50 text-rose-600">
                  <Icon name="alert" className="w-5 h-5" />
                </div>
              </div>
              <div className="flex items-baseline gap-3 mt-3">
                <div>
                  <span className="text-2xl font-black text-rose-600">{outOfStockProducts.length}</span>
                  <span className="text-xs font-semibold text-slate-500 ml-1">Habis</span>
                </div>
                <div className="text-slate-300">|</div>
                <div>
                  <span className="text-2xl font-black text-amber-600">{lowStockProducts.length}</span>
                  <span className="text-xs font-semibold text-slate-500 ml-1">Menipis</span>
                </div>
              </div>
              <button
                onClick={() => setActiveTab('products')}
                className="text-xs text-emerald-600 hover:text-emerald-700 font-semibold mt-1 flex items-center gap-1"
              >
                Lihat daftar produk &rarr;
              </button>
            </div>
          </div>

          {/* CHARTS & RECENT ACTIVITIES ROW */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* VISUAL CHART: TREN PENJUALAN & LABA 7 HARI */}
            <div className="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
              <div className="flex items-center justify-between mb-4">
                <div>
                  <h3 className="font-bold text-slate-800 text-base">Grafik Penjualan & Keuntungan 7 Hari Terakhir</h3>
                  <p className="text-xs text-slate-500">Perbandingan omzet harian dengan keuntungan kotor</p>
                </div>
                <div className="flex items-center gap-3 text-xs">
                  <div className="flex items-center gap-1.5">
                    <span className="w-3 h-3 rounded-sm bg-emerald-500"></span>
                    <span className="text-slate-600 font-medium">Penjualan</span>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span className="w-3 h-3 rounded-sm bg-teal-400"></span>
                    <span className="text-slate-600 font-medium">Laba Kotor</span>
                  </div>
                </div>
              </div>

              {/* Bar visualization */}
              <div className="h-56 flex items-end justify-between gap-3 pt-6 pb-2 px-2 border-b border-slate-100">
                {trendData.map((d, idx) => {
                  const revHeight = maxTrendVal > 0 ? (d.revenue / maxTrendVal) * 100 : 0;
                  const profitHeight = maxTrendVal > 0 ? (d.profit / maxTrendVal) * 100 : 0;
                  return (
                    <div key={idx} className="flex-1 flex flex-col items-center gap-1 group relative">
                      {/* Tooltip on hover */}
                      <div className="absolute -top-14 bg-slate-900 text-white text-[10px] px-2 py-1 rounded shadow-lg opacity-0 group-hover:opacity-100 transition pointer-events-none whitespace-nowrap z-20">
                        <div>Penjualan: {formatRp(d.revenue)}</div>
                        <div>Laba: {formatRp(d.profit)}</div>
                      </div>

                      {/* Bar Group */}
                      <div className="w-full max-w-[40px] flex items-end justify-center gap-1 h-44">
                        <div
                          style={{ height: `${Math.max(revHeight, 4)}%` }}
                          className="w-1/2 bg-emerald-500 rounded-t-md transition-all group-hover:bg-emerald-600"
                        ></div>
                        <div
                          style={{ height: `${Math.max(profitHeight, 2)}%` }}
                          className="w-1/2 bg-teal-400 rounded-t-md transition-all group-hover:bg-teal-500"
                        ></div>
                      </div>
                      <span className="text-[11px] font-semibold text-slate-600 mt-1">{d.label}</span>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* TOP SELLING PRODUCTS */}
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs flex flex-col">
              <div className="flex items-center justify-between mb-4">
                <h3 className="font-bold text-slate-800 text-base">Produk Terlaris</h3>
                <span className="text-xs text-slate-400 font-medium">Berdasarkan qty</span>
              </div>
              <div className="flex-1 space-y-3.5">
                {topSellingProducts.length === 0 ? (
                  <p className="text-xs text-slate-400 py-8 text-center">Belum ada transaksi penjualan yang tercatat.</p>
                ) : (
                  topSellingProducts.map((p, idx) => (
                    <div key={idx} className="flex items-center justify-between gap-3 text-xs">
                      <div className="flex items-center gap-2.5 min-w-0">
                        <span className="w-5 h-5 rounded-full bg-slate-100 text-slate-600 font-bold flex items-center justify-center text-[10px] flex-shrink-0">
                          {idx + 1}
                        </span>
                        <div className="truncate">
                          <p className="font-bold text-slate-800 truncate">{p.name}</p>
                          <p className="text-[10px] text-slate-400">{p.sku}</p>
                        </div>
                      </div>
                      <div className="text-right flex-shrink-0">
                        <p className="font-bold text-emerald-600">{p.qty} {p.unit}</p>
                        <p className="text-[10px] text-slate-400">{formatRp(p.revenue)}</p>
                      </div>
                    </div>
                  ))
                )}
              </div>
              <button
                onClick={() => setActiveTab('reports')}
                className="mt-4 pt-3 border-t border-slate-100 text-xs font-semibold text-emerald-600 hover:text-emerald-700 text-center block"
              >
                Lihat Analisis Lengkap &rarr;
              </button>
            </div>
          </div>

          {/* RECENT TRANSACTIONS TABLE */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
            <div className="flex items-center justify-between mb-4">
              <div>
                <h3 className="font-bold text-slate-800 text-base">Transaksi Penjualan Terbaru</h3>
                <p className="text-xs text-slate-500">5 transaksi terakhir yang dicatat di kasir</p>
              </div>
              <button
                onClick={() => setActiveTab('pos')}
                className="px-3 py-1.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-xl text-xs font-bold transition flex items-center gap-1.5"
              >
                <Icon name="pos" className="w-4 h-4" />
                Buka Kasir POS
              </button>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead>
                  <tr className="border-b border-slate-200 text-slate-500 font-semibold uppercase tracking-wider">
                    <th className="py-2.5 px-3">No. Struk</th>
                    <th className="py-2.5 px-3">Waktu</th>
                    <th className="py-2.5 px-3">Item Dibeli</th>
                    <th className="py-2.5 px-3">Metode</th>
                    <th className="py-2.5 px-3">Total Belanja</th>
                    <th className="py-2.5 px-3">Kasir</th>
                    <th className="py-2.5 px-3">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {sales.slice(0, 5).map(s => (
                    <tr key={s.id} className="hover:bg-slate-50/80 transition">
                      <td className="py-3 px-3 font-bold text-slate-800">{s.invoiceNumber}</td>
                      <td className="py-3 px-3 text-slate-600">{formatDateTimeIndo(s.date)}</td>
                      <td className="py-3 px-3 text-slate-600">
                        {s.items.map(i => `${i.productName} (${i.quantity})`).join(', ')}
                      </td>
                      <td className="py-3 px-3 uppercase font-semibold text-slate-700">{s.paymentMethod}</td>
                      <td className="py-3 px-3 font-bold text-emerald-600">{formatRp(s.total)}</td>
                      <td className="py-3 px-3 text-slate-600">{s.cashierName}</td>
                      <td className="py-3 px-3">
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                          s.status === 'completed'
                            ? 'bg-emerald-100 text-emerald-800'
                            : 'bg-rose-100 text-rose-800'
                        }`}>
                          {s.status === 'completed' ? 'Selesai' : 'Dibatalkan'}
                        </span>
                      </td>
                    </tr>
                  ))}
                  {sales.length === 0 && (
                    <tr>
                      <td colSpan="7" className="py-6 text-center text-slate-400">Belum ada riwayat transaksi</td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 2. POS KASIR VIEW COMPONENT
    // ==========================================
    function PosView({ products, setProducts, sales, setSales, movements, setMovements, categoryMap, settings, currentUser, showToast }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCat, setSelectedCat] = useState('all');
      const [cart, setCart] = useState([]);
      const [discount, setDiscount] = useState(0);
      const [paymentMethod, setPaymentMethod] = useState('cash');
      const [cashReceived, setCashReceived] = useState('');
      const [activeReceipt, setActiveReceipt] = useState(null);
      const [showHistory, setShowHistory] = useState(false);
      const [cancelModal, setCancelModal] = useState(null);
      const [cancelReason, setCancelReason] = useState('');

      // State Pembayaran Digital (QRIS & Transfer Bank)
      const [showQrisModal, setShowQrisModal] = useState(false);
      const [qrisPaidSimulated, setQrisPaidSimulated] = useState(false);
      const [selectedBankId, setSelectedBankId] = useState(() => (settings.bankAccounts && settings.bankAccounts[0]) ? settings.bankAccounts[0].id : 'bank-1');
      const [transferSenderName, setTransferSenderName] = useState('');
      const [transferRef, setTransferRef] = useState('');
      const [transferVerified, setTransferVerified] = useState(false);
      const [copiedField, setCopiedField] = useState(null);

      const activeProducts = products.filter(p => !p.isArchived);

      // Filter products
      const filteredProducts = activeProducts.filter(p => {
        const matchesCat = selectedCat === 'all' || p.categoryId === selectedCat;
        const q = searchQuery.toLowerCase().trim();
        const matchesSearch = !q ||
          p.name.toLowerCase().includes(q) ||
          p.sku.toLowerCase().includes(q) ||
          (p.barcode && p.barcode.toLowerCase().includes(q));
        return matchesCat && matchesSearch;
      });

      // Cart Calculations
      const subtotal = cart.reduce((acc, item) => acc + (item.sellingPrice * item.quantity), 0);
      const finalTotal = Math.max(0, subtotal - (Number(discount) || 0));
      const cashNum = Number(cashReceived) || 0;
      const change = paymentMethod === 'cash' ? Math.max(0, cashNum - finalTotal) : 0;

      // Add to Cart with Stock Protection
      const addToCart = (product) => {
        if (product.stock <= 0) {
          showToast(`Stok "${product.name}" habis! Tidak dapat ditambahkan ke keranjang.`, 'error');
          return;
        }

        setCart(prev => {
          const existing = prev.find(item => item.productId === product.id);
          if (existing) {
            if (existing.quantity >= product.stock) {
              showToast(`Jumlah melebihi stok yang tersedia (${product.stock} ${product.unit})!`, 'error');
              return prev;
            }
            return prev.map(item =>
              item.productId === product.id ? { ...item, quantity: item.quantity + 1 } : item
            );
          } else {
            return [...prev, {
              productId: product.id,
              productName: product.name,
              sku: product.sku,
              unit: product.unit,
              costPrice: product.costPrice,
              sellingPrice: product.sellingPrice,
              quantity: 1,
              maxStock: product.stock,
            }];
          }
        });
      };

      // Adjust Qty
      const updateQty = (productId, delta) => {
        setCart(prev => {
          return prev.map(item => {
            if (item.productId === productId) {
              const newQty = item.quantity + delta;
              if (newQty <= 0) return null;
              if (newQty > item.maxStock) {
                showToast(`Maksimal stok tersedia adalah ${item.maxStock} ${item.unit}!`, 'error');
                return item;
              }
              return { ...item, quantity: newQty };
            }
            return item;
          }).filter(Boolean);
        });
      };

      const removeFromCart = (productId) => {
        setCart(prev => prev.filter(item => item.productId !== productId));
      };

      // Checkout Transaction
      const handleCheckout = () => {
        if (cart.length === 0) {
          showToast('Keranjang belanja masih kosong!', 'error');
          return;
        }

        if (paymentMethod === 'cash' && cashNum < finalTotal) {
          showToast(`Uang tunai kurang ${formatRp(finalTotal - cashNum)}!`, 'error');
          return;
        }

        if (paymentMethod === 'transfer' && !transferVerified) {
          showToast('Harap beri centang verifikasi bahwa mutasi transfer telah masuk!', 'error');
          return;
        }

        // Verify stock once more
        for (const item of cart) {
          const currentProd = products.find(p => p.id === item.productId);
          if (!currentProd || currentProd.stock < item.quantity) {
            showToast(`Stok untuk "${item.productName}" tidak mencukupi (sisa ${currentProd ? currentProd.stock : 0})!`, 'error');
            return;
          }
        }

        const now = new Date();
        const dateStr = now.toISOString();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const invoiceNumber = `TRX-${yyyy}${mm}${dd}-${Math.floor(1000 + Math.random() * 9000)}`;

        // Get bank details if transfer
        const currentBank = (settings.bankAccounts || []).find(b => b.id === selectedBankId) || (settings.bankAccounts && settings.bankAccounts[0]) || {
          bankName: 'Bank BCA',
          accountNumber: '8720-192-831',
          accountHolder: settings.ownerName || 'Budi Santoso'
        };

        const paymentDetails = paymentMethod === 'qris' ? {
          type: 'qris',
          nmid: settings.qrisNmid || 'ID102030405060',
          merchantName: settings.qrisMerchantName || settings.storeName,
          rrn: `RRN-${Date.now().toString().slice(-8)}`,
          status: 'PAID',
        } : paymentMethod === 'transfer' ? {
          type: 'transfer',
          bankName: currentBank.bankName,
          accountNumber: currentBank.accountNumber,
          accountHolder: currentBank.accountHolder,
          senderName: transferSenderName.trim() || 'Pelanggan',
          refNumber: transferRef.trim() || `TRF-${Math.floor(1000 + Math.random() * 9000)}`,
          status: 'VERIFIED',
        } : {
          type: 'cash'
        };

        // Atomic update on products
        const updatedProducts = products.map(p => {
          const cartItem = cart.find(ci => ci.productId === p.id);
          if (cartItem) {
            return { ...p, stock: p.stock - cartItem.quantity, updatedAt: dateStr };
          }
          return p;
        });

        // Record stock movements
        const newMovements = cart.map(item => {
          const p = products.find(prod => prod.id === item.productId);
          return {
            id: 'mov-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
            date: dateStr,
            productId: item.productId,
            productName: item.productName,
            sku: item.sku,
            stockBefore: p ? p.stock : 0,
            change: -item.quantity,
            stockAfter: (p ? p.stock : 0) - item.quantity,
            type: 'sale',
            typeLabel: 'Penjualan Kasir',
            referenceNumber: invoiceNumber,
            notes: `Struk penjualan ${invoiceNumber} (${paymentMethod.toUpperCase()})`,
            userName: currentUser.name,
          };
        });

        const newSale = {
          id: 'trx-' + Date.now(),
          invoiceNumber,
          date: dateStr,
          items: cart.map(i => ({
            productId: i.productId,
            productName: i.productName,
            sku: i.sku,
            unit: i.unit,
            quantity: i.quantity,
            sellingPrice: i.sellingPrice,
            costPrice: i.costPrice,
            subtotal: i.sellingPrice * i.quantity,
          })),
          subtotal,
          discount: Number(discount) || 0,
          total: finalTotal,
          paymentMethod,
          cashReceived: paymentMethod === 'cash' ? cashNum : finalTotal,
          change,
          paymentDetails,
          status: 'completed',
          cashierName: currentUser.name,
        };

        setProducts(updatedProducts);
        setMovements([...newMovements, ...movements]);
        setSales([newSale, ...sales]);

        // Reset cart and checkout states
        setCart([]);
        setDiscount(0);
        setCashReceived('');
        setTransferSenderName('');
        setTransferRef('');
        setTransferVerified(false);
        setQrisPaidSimulated(false);
        setActiveReceipt(newSale);
        showToast(`Transaksi ${paymentMethod === 'qris' ? 'QRIS' : paymentMethod === 'transfer' ? 'Transfer Bank' : 'Tunai'} berhasil disimpan!`);
      };

      // Cancel Sale with Stock Rollback
      const handleConfirmCancelSale = () => {
        if (!cancelModal) return;
        if (!cancelReason.trim()) {
          showToast('Alasan pembatalan transaksi wajib diisi!', 'error');
          return;
        }

        const saleToCancel = sales.find(s => s.id === cancelModal.id);
        if (!saleToCancel) return;

        const now = new Date().toISOString();

        // Rollback product stock
        const updatedProducts = products.map(p => {
          const soldItem = saleToCancel.items.find(i => i.productId === p.id);
          if (soldItem) {
            return { ...p, stock: p.stock + soldItem.quantity, updatedAt: now };
          }
          return p;
        });

        // Record rollback movements
        const rollbackMovements = saleToCancel.items.map(item => {
          const p = products.find(prod => prod.id === item.productId);
          return {
            id: 'mov-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
            date: now,
            productId: item.productId,
            productName: item.productName,
            sku: item.sku,
            stockBefore: p ? p.stock : 0,
            change: item.quantity,
            stockAfter: (p ? p.stock : 0) + item.quantity,
            type: 'sale_cancellation',
            typeLabel: 'Pembatalan Penjualan',
            referenceNumber: saleToCancel.invoiceNumber,
            notes: `Batal struk ${saleToCancel.invoiceNumber}: ${cancelReason.trim()}`,
            userName: currentUser.name,
          };
        });

        // Update sales status
        const updatedSales = sales.map(s => {
          if (s.id === saleToCancel.id) {
            return {
              ...s,
              status: 'cancelled',
              cancellationReason: cancelReason.trim(),
              cancelledAt: now,
            };
          }
          return s;
        });

        setProducts(updatedProducts);
        setMovements([...rollbackMovements, ...movements]);
        setSales(updatedSales);
        setCancelModal(null);
        setCancelReason('');
        showToast(`Transaksi ${saleToCancel.invoiceNumber} berhasil dibatalkan dan stok dikembalikan!`);
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          {/* LEFT: PRODUCT CATALOG */}
          <div className="lg:col-span-7 flex flex-col space-y-4">
            {/* SEARCH & ACTIONS */}
            <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-wrap items-center justify-between gap-3">
              <div className="relative flex-1 min-w-[220px]">
                <Icon name="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" />
                <input
                  type="text"
                  placeholder="Cari nama barang, kode SKU, atau barcode..."
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-hidden"
                />
              </div>
              <button
                onClick={() => setShowHistory(true)}
                className="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition flex items-center gap-1.5"
              >
                <Icon name="report" className="w-4 h-4" />
                Riwayat Transaksi
              </button>
            </div>

            {/* CATEGORY PILLS */}
            <div className="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
              <button
                onClick={() => setSelectedCat('all')}
                className={`px-3 py-1.5 rounded-xl font-semibold whitespace-nowrap transition ${
                  selectedCat === 'all'
                    ? 'bg-emerald-600 text-white shadow-xs'
                    : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'
                }`}
              >
                Semua Kategori
              </button>
              {Object.entries(categoryMap).map(([id, name]) => (
                <button
                  key={id}
                  onClick={() => setSelectedCat(id)}
                  className={`px-3 py-1.5 rounded-xl font-semibold whitespace-nowrap transition ${
                    selectedCat === id
                      ? 'bg-emerald-600 text-white shadow-xs'
                      : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'
                  }`}
                >
                  {name}
                </button>
              ))}
            </div>

            {/* PRODUCT CARDS GRID */}
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3.5 flex-1 overflow-y-auto max-h-[620px] pr-1">
              {filteredProducts.map(p => {
                const isOutOfStock = p.stock === 0;
                const isLow = p.stock > 0 && p.stock <= p.minStock;
                const inCart = cart.find(ci => ci.productId === p.id);

                return (
                  <div
                    key={p.id}
                    onClick={() => !isOutOfStock && addToCart(p)}
                    className={`bg-white rounded-2xl p-3.5 border transition flex flex-col justify-between relative group ${
                      isOutOfStock
                        ? 'opacity-60 border-slate-200 cursor-not-allowed bg-slate-50'
                        : 'border-slate-200 hover:border-emerald-500 hover:shadow-md cursor-pointer'
                    }`}
                  >
                    {inCart && (
                      <span className="absolute top-2 right-2 w-6 h-6 rounded-full bg-emerald-600 text-white text-xs font-bold flex items-center justify-center shadow-xs">
                        {inCart.quantity}
                      </span>
                    )}

                    <div>
                      <div className="flex items-center justify-between gap-1 mb-1.5">
                        <span className="text-[10px] font-semibold text-slate-400 truncate">{p.sku}</span>
                        <span className={`px-1.5 py-0.5 rounded text-[9px] font-bold ${
                          isOutOfStock
                            ? 'bg-rose-100 text-rose-700'
                            : isLow
                            ? 'bg-amber-100 text-amber-700'
                            : 'bg-emerald-100 text-emerald-700'
                        }`}>
                          {isOutOfStock ? 'Habis' : `${p.stock} ${p.unit}`}
                        </span>
                      </div>
                      <h4 className="font-bold text-xs text-slate-800 line-clamp-2 leading-snug">{p.name}</h4>
                      <p className="text-[10px] text-slate-400 mt-1">{categoryMap[p.categoryId] || 'Umum'}</p>
                    </div>

                    <div className="mt-3 pt-2.5 border-t border-slate-100 flex items-center justify-between">
                      <span className="font-extrabold text-xs text-emerald-600">{formatRp(p.sellingPrice)}</span>
                      <button
                        disabled={isOutOfStock}
                        className={`p-1.5 rounded-lg text-xs font-bold ${
                          isOutOfStock
                            ? 'bg-slate-200 text-slate-400'
                            : 'bg-emerald-50 text-emerald-600 group-hover:bg-emerald-600 group-hover:text-white transition'
                        }`}
                      >
                        <Icon name="plus" className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  </div>
                );
              })}
              {filteredProducts.length === 0 && (
                <div className="col-span-full py-12 text-center text-slate-400">
                  <Icon name="search" className="w-8 h-8 mx-auto mb-2 opacity-50" />
                  <p className="font-medium text-xs">Produk tidak ditemukan.</p>
                </div>
              )}
            </div>
          </div>

          {/* RIGHT: CART & CHECKOUT PANEL */}
          <div className="lg:col-span-5 bg-white rounded-2xl border border-slate-200 shadow-xs flex flex-col h-[740px]">
            {/* CART HEADER */}
            <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50 rounded-t-2xl">
              <div className="flex items-center gap-2">
                <Icon name="pos" className="w-5 h-5 text-emerald-600" />
                <h3 className="font-bold text-sm text-slate-800">Keranjang Belanja</h3>
                <span className="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-bold">
                  {cart.length} item
                </span>
              </div>
              {cart.length > 0 && (
                <button
                  onClick={() => setCart([])}
                  className="text-xs text-rose-600 hover:text-rose-700 font-semibold"
                >
                  Kosongkan
                </button>
              )}
            </div>

            {/* CART ITEMS LIST */}
            <div className="flex-1 p-4 overflow-y-auto divide-y divide-slate-100 space-y-3">
              {cart.length === 0 ? (
                <div className="py-16 text-center text-slate-400">
                  <Icon name="pos" className="w-10 h-10 mx-auto mb-2 opacity-40" />
                  <p className="font-bold text-sm text-slate-600">Keranjang masih kosong</p>
                  <p className="text-xs text-slate-400 mt-1">Pilih barang dari etalase di sebelah kiri</p>
                </div>
              ) : (
                cart.map(item => (
                  <div key={item.productId} className="pt-3 first:pt-0 flex items-center justify-between gap-3 text-xs">
                    <div className="flex-1 min-w-0">
                      <p className="font-bold text-slate-800 truncate">{item.productName}</p>
                      <p className="text-[11px] text-slate-500">
                        {formatRp(item.sellingPrice)} &times; {item.quantity} = <span className="font-bold text-slate-700">{formatRp(item.sellingPrice * item.quantity)}</span>
                      </p>
                    </div>

                    <div className="flex items-center gap-1.5 flex-shrink-0">
                      <button
                        onClick={() => updateQty(item.productId, -1)}
                        className="w-6 h-6 rounded-md bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold flex items-center justify-center transition"
                      >
                        -
                      </button>
                      <span className="w-7 text-center font-bold text-slate-800">{item.quantity}</span>
                      <button
                        onClick={() => updateQty(item.productId, 1)}
                        className="w-6 h-6 rounded-md bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold flex items-center justify-center transition"
                      >
                        +
                      </button>
                      <button
                        onClick={() => removeFromCart(item.productId)}
                        className="p-1 text-slate-300 hover:text-rose-600 ml-1 transition"
                      >
                        <Icon name="trash" className="w-4 h-4" />
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>

            {/* CART SUMMARY & PAYMENT */}
            <div className="p-4 border-t border-slate-100 bg-slate-50/80 rounded-b-2xl space-y-3 text-xs">
              <div className="flex justify-between text-slate-600 font-medium">
                <span>Subtotal:</span>
                <span className="font-bold text-slate-800">{formatRp(subtotal)}</span>
              </div>

              {/* DISCOUNT INPUT */}
              <div className="flex items-center justify-between gap-2">
                <span className="text-slate-600 font-medium">Potongan / Diskon (Rp):</span>
                <input
                  type="number"
                  min="0"
                  placeholder="0"
                  value={discount || ''}
                  onChange={e => setDiscount(Math.max(0, Number(e.target.value)))}
                  className="w-28 px-2 py-1 text-right border border-slate-300 rounded-lg text-xs font-semibold focus:outline-hidden"
                />
              </div>

              <div className="flex justify-between items-baseline pt-2 border-t border-slate-200 text-sm">
                <span className="font-extrabold text-slate-800">Total Tagihan:</span>
                <span className="text-xl font-black text-emerald-600">{formatRp(finalTotal)}</span>
              </div>

              {/* PAYMENT METHOD SELECTOR */}
              <div className="pt-2">
                <span className="block font-semibold text-slate-600 mb-1.5 text-[11px]">Pilih Metode Pembayaran:</span>
                <div className="grid grid-cols-3 gap-2">
                  {[
                    { id: 'cash', label: 'Tunai', icon: 'pos', color: 'emerald' },
                    { id: 'qris', label: 'QRIS', icon: 'qr', color: 'rose' },
                    { id: 'transfer', label: 'Transfer', icon: 'bank', color: 'blue' },
                  ].map(m => (
                    <button
                      key={m.id}
                      type="button"
                      onClick={() => setPaymentMethod(m.id)}
                      className={`py-2 px-1 rounded-xl text-xs font-bold transition border flex items-center justify-center gap-1.5 ${
                        paymentMethod === m.id
                          ? m.id === 'qris'
                            ? 'bg-rose-600 text-white border-rose-600 shadow-xs'
                            : m.id === 'transfer'
                            ? 'bg-blue-600 text-white border-blue-600 shadow-xs'
                            : 'bg-emerald-600 text-white border-emerald-600 shadow-xs'
                          : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100'
                      }`}
                    >
                      <Icon name={m.icon} className="w-3.5 h-3.5" />
                      {m.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* 1. CASH PAYMENT CONTROLS */}
              {paymentMethod === 'cash' && (
                <div className="space-y-2 pt-1 animate-fadeIn">
                  <div className="flex items-center justify-between gap-2">
                    <span className="font-semibold text-slate-700">Uang Diterima:</span>
                    <input
                      type="number"
                      placeholder="Rp..."
                      value={cashReceived}
                      onChange={e => setCashReceived(e.target.value)}
                      className="w-36 px-2.5 py-1.5 text-right font-bold text-slate-800 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-hidden"
                    />
                  </div>

                  {/* QUICK MONEY BUTTONS */}
                  <div className="flex flex-wrap gap-1.5 justify-end">
                    {[
                      { label: 'Uang Pas', val: finalTotal },
                      { label: '10 rb', val: 10000 },
                      { label: '20 rb', val: 20000 },
                      { label: '50 rb', val: 50000 },
                      { label: '100 rb', val: 100000 },
                    ].map((btn, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => setCashReceived(btn.val.toString())}
                        className="px-2 py-1 rounded bg-slate-200 hover:bg-slate-300 text-[10px] font-bold text-slate-700 transition"
                      >
                        {btn.label}
                      </button>
                    ))}
                  </div>

                  {cashNum >= finalTotal && finalTotal > 0 && (
                    <div className="flex justify-between items-center p-2 rounded-lg bg-emerald-100 text-emerald-900 font-bold">
                      <span>Kembalian:</span>
                      <span className="text-sm font-extrabold">{formatRp(change)}</span>
                    </div>
                  )}
                </div>
              )}

              {/* 2. QRIS PAYMENT CONTROLS */}
              {paymentMethod === 'qris' && (
                <div className="space-y-2.5 pt-1 animate-fadeIn">
                  <div className="bg-white rounded-xl border-2 border-rose-600 overflow-hidden shadow-xs">
                    {/* RED QRIS BANNER */}
                    <div className="bg-rose-600 px-3 py-1.5 flex items-center justify-between text-white">
                      <div className="flex items-center gap-1.5">
                        <span className="font-black text-xs tracking-wider">QRIS</span>
                        <span className="text-[9px] opacity-90 font-medium border-l border-rose-400 pl-1.5">PEMBAYARAN DIGITAL</span>
                      </div>

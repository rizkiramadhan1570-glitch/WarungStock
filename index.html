                  <button
                    onClick={() => { setCancelModal(null); setCancelReason(''); }}
                    className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold"
                  >
                    Batal
                  </button>
                  <button
                    onClick={handleConfirmCancelSale}
                    className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold"
                  >
                    Proses Pembatalan & Rollback Stok
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 3. PRODUCTS VIEW COMPONENT
    // ==========================================
    function ProductsView({ products, setProducts, categories, suppliers, categoryMap, supplierMap, sales, purchases, movements, setMovements, currentUser, showToast }) {
      const [search, setSearch] = useState('');
      const [selectedCat, setSelectedCat] = useState('all');
      const [stockFilter, setStockFilter] = useState('all'); // all, safe, low, empty, archived
      const [sortBy, setSortBy] = useState('name-asc');
      const [modalOpen, setModalOpen] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);
      const [deleteModal, setDeleteModal] = useState(null);
      const [importModal, setImportModal] = useState(false);
      const [csvInput, setCsvInput] = useState('');

      // Form State
      const [formData, setFormData] = useState({
        sku: '',
        barcode: '',
        name: '',
        categoryId: '',
        unit: 'pcs',
        costPrice: '',
        sellingPrice: '',
        stock: '',
        minStock: '5',
        supplierId: '',
        expiryDate: '',
      });

      // Filtered & Sorted Products
      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          // Archive check
          if (stockFilter === 'archived') {
            if (!p.isArchived) return false;
          } else {
            if (p.isArchived) return false;
            if (stockFilter === 'safe' && p.stock <= p.minStock) return false;
            if (stockFilter === 'low' && (p.stock === 0 || p.stock > p.minStock)) return false;
            if (stockFilter === 'empty' && p.stock > 0) return false;
          }

          if (selectedCat !== 'all' && p.categoryId !== selectedCat) return false;

          const q = search.toLowerCase().trim();
          if (q) {
            const matchName = p.name.toLowerCase().includes(q);
            const matchSku = p.sku.toLowerCase().includes(q);
            const matchBarcode = p.barcode && p.barcode.toLowerCase().includes(q);
            if (!matchName && !matchSku && !matchBarcode) return false;
          }
          return true;
        }).sort((a, b) => {
          if (sortBy === 'name-asc') return a.name.localeCompare(b.name);
          if (sortBy === 'name-desc') return b.name.localeCompare(a.name);
          if (sortBy === 'stock-asc') return a.stock - b.stock;
          if (sortBy === 'stock-desc') return b.stock - a.stock;
          if (sortBy === 'price-asc') return a.sellingPrice - b.sellingPrice;
          if (sortBy === 'price-desc') return b.sellingPrice - a.sellingPrice;
          return 0;
        });
      }, [products, stockFilter, selectedCat, search, sortBy]);

      const openAddModal = () => {
        setEditingProduct(null);
        setFormData({
          sku: `SKU-${Math.floor(100 + Math.random() * 900)}`,
          barcode: '',
          name: '',
          categoryId: categories[0]?.id || '',
          unit: 'pcs',
          costPrice: '',
          sellingPrice: '',
          stock: '0',
          minStock: '5',
          supplierId: suppliers[0]?.id || '',
          expiryDate: '',
        });
        setModalOpen(true);
      };

      const openEditModal = (p) => {
        setEditingProduct(p);
        setFormData({
          sku: p.sku,
          barcode: p.barcode || '',
          name: p.name,
          categoryId: p.categoryId,
          unit: p.unit,
          costPrice: p.costPrice.toString(),
          sellingPrice: p.sellingPrice.toString(),
          stock: p.stock.toString(),
          minStock: p.minStock.toString(),
          supplierId: p.supplierId || '',
          expiryDate: p.expiryDate || '',
        });
        setModalOpen(true);
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        const skuTrimmed = formData.sku.trim().toUpperCase();
        if (!skuTrimmed || !formData.name.trim()) {
          showToast('Kode SKU dan Nama Produk wajib diisi!', 'error');
          return;
        }

        // Check duplicate SKU
        const duplicate = products.find(p =>
          p.sku.toUpperCase() === skuTrimmed &&
          (!editingProduct || p.id !== editingProduct.id)
        );
        if (duplicate) {
          showToast(`Kode SKU "${skuTrimmed}" sudah dipakai oleh produk "${duplicate.name}"!`, 'error');
          return;
        }

        const cost = Number(formData.costPrice) || 0;
        const sell = Number(formData.sellingPrice) || 0;
        const stockNum = Number(formData.stock) || 0;
        const minNum = Number(formData.minStock) || 0;

        if (cost < 0 || sell < 0 || stockNum < 0) {
          showToast('Harga dan stok tidak boleh negatif!', 'error');
          return;
        }

        const now = new Date().toISOString();

        if (editingProduct) {
          // Edit
          const oldStock = editingProduct.stock;
          const updated = products.map(p => {
            if (p.id === editingProduct.id) {
              return {
                ...p,
                sku: skuTrimmed,
                barcode: formData.barcode.trim() || undefined,
                name: formData.name.trim(),
                categoryId: formData.categoryId,
                unit: formData.unit,
                costPrice: cost,
                sellingPrice: sell,
                stock: stockNum,
                minStock: minNum,
                supplierId: formData.supplierId,
                expiryDate: formData.expiryDate || undefined,
                updatedAt: now,
              };
            }
            return p;
          });

          // Record movement if stock was changed directly
          if (oldStock !== stockNum) {
            const movement = {
              id: 'mov-' + Date.now(),
              date: now,
              productId: editingProduct.id,
              productName: formData.name.trim(),
              sku: skuTrimmed,
              stockBefore: oldStock,
              change: stockNum - oldStock,
              stockAfter: stockNum,
              type: 'adjustment',
              typeLabel: 'Edit Manual Stok',
              referenceNumber: 'EDIT-MANUAL',
              notes: 'Penyesuaian stok langsung dari formulir edit produk',
              userName: currentUser.name,
            };
            setMovements([movement, ...movements]);
          }

          setProducts(updated);
          showToast(`Produk "${formData.name.trim()}" berhasil diperbarui.`);
        } else {
          // Add New
          const newProd = {
            id: 'prd-' + Date.now(),
            sku: skuTrimmed,
            barcode: formData.barcode.trim() || undefined,
            name: formData.name.trim(),
            categoryId: formData.categoryId,
            unit: formData.unit,
            costPrice: cost,
            sellingPrice: sell,
            stock: stockNum,
            minStock: minNum,
            supplierId: formData.supplierId,
            expiryDate: formData.expiryDate || undefined,
            isArchived: false,
            createdAt: now,
            updatedAt: now,
          };

          if (stockNum > 0) {
            const movement = {
              id: 'mov-' + Date.now(),
              date: now,
              productId: newProd.id,
              productName: newProd.name,
              sku: newProd.sku,
              stockBefore: 0,
              change: stockNum,
              stockAfter: stockNum,
              type: 'adjustment',
              typeLabel: 'Stok Awal Baru',
              referenceNumber: 'INIT-' + newProd.sku,
              notes: 'Pencatatan stok awal produk baru',
              userName: currentUser.name,
            };
            setMovements([movement, ...movements]);
          }

          setProducts([...products, newProd]);
          showToast(`Produk baru "${newProd.name}" berhasil ditambahkan.`);
        }

        setModalOpen(false);
      };

      // Delete or Archive Protection
      const confirmDeleteOrArchive = () => {
        if (!deleteModal) return;

        const hasSales = sales.some(s => s.items.some(i => i.productId === deleteModal.id));
        const hasPurchases = purchases.some(p => p.items.some(i => i.productId === deleteModal.id));

        if (hasSales || hasPurchases) {
          // Archive product instead
          setProducts(products.map(p => p.id === deleteModal.id ? { ...p, isArchived: true } : p));
          showToast(`Produk "${deleteModal.name}" memiliki riwayat transaksi, sehingga dialihkan ke status ARSIP agar laporan historis tidak rusak.`, 'warning');
        } else {
          // Permanently delete
          setProducts(products.filter(p => p.id !== deleteModal.id));
          showToast(`Produk "${deleteModal.name}" berhasil dihapus secara permanen.`);
        }
        setDeleteModal(null);
      };

      // Export Products to CSV
      const handleExportCsv = () => {
        const headers = ['SKU', 'Barcode', 'Nama Produk', 'Kategori', 'Satuan', 'Harga Modal', 'Harga Jual', 'Stok', 'Min Stok', 'Pemasok', 'Kedaluwarsa', 'Status'];
        const rows = products.map(p => [
          `"${p.sku}"`,
          `"${p.barcode || ''}"`,
          `"${p.name.replace(/"/g, '""')}"`,
          `"${categoryMap[p.categoryId] || ''}"`,
          `"${p.unit}"`,
          p.costPrice,
          p.sellingPrice,
          p.stock,
          p.minStock,
          `"${supplierMap[p.supplierId] || ''}"`,
          `"${p.expiryDate || ''}"`,
          p.isArchived ? 'Arsip' : 'Aktif'
        ]);

        const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `Daftar_Produk_WarungStock_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('File CSV produk berhasil diekspor!');
      };

      // Import Products from CSV Text
      const handleImportCsv = () => {
        if (!csvInput.trim()) {
          showToast('Isi teks CSV terlebih dahulu!', 'error');
          return;
        }

        const lines = csvInput.trim().split(/\r?\n/);
        if (lines.length < 2) {
          showToast('Format CSV tidak memiliki data.', 'error');
          return;
        }

        let imported = 0;
        const newProducts = [...products];

        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(',').map(c => c.replace(/^"|"$/g, '').trim());
          if (cols.length >= 4) {
            const sku = cols[0]?.toUpperCase();
            const name = cols[2] || cols[1];
            if (!sku || !name) continue;

            const duplicate = newProducts.find(p => p.sku === sku);
            if (duplicate) continue; // Skip duplicate

            const unit = cols[4] || 'pcs';
            const cost = Number(cols[5]) || 1000;
            const sell = Number(cols[6]) || 1500;
            const stock = Number(cols[7]) || 10;
            const minStock = Number(cols[8]) || 5;

            newProducts.push({
              id: 'prd-' + Date.now() + '-' + i,
              sku,
              barcode: cols[1] || undefined,
              name,
              categoryId: categories[0]?.id || 'cat-8',
              unit,
              costPrice: cost,
              sellingPrice: sell,
              stock,
              minStock,
              supplierId: suppliers[0]?.id || '',
              isArchived: false,
              createdAt: new Date().toISOString(),
              updatedAt: new Date().toISOString(),
            });
            imported++;
          }
        }

        setProducts(newProducts);
        setImportModal(false);
        setCsvInput('');
        showToast(`Berhasil mengimpor ${imported} produk dari file CSV!`);
      };

      return (
        <div className="space-y-5">
          {/* TOP BAR */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
            <div>
              <h2 className="text-xl font-extrabold text-slate-800 tracking-tight">Manajemen Produk & Persediaan</h2>
              <p className="text-xs text-slate-500 mt-0.5">Kelola katalog barang warung, harga modal, harga jual, dan batas stok minimum.</p>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={handleExportCsv}
                className="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition flex items-center gap-1.5"
                title="Ekspor ke format CSV / Excel"
              >
                <Icon name="download" className="w-4 h-4" />
                Ekspor CSV
              </button>
              <button
                onClick={() => setImportModal(true)}
                className="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition flex items-center gap-1.5"
                title="Impor dari CSV"
              >
                <Icon name="upload" className="w-4 h-4" />
                Impor CSV
              </button>
              <button
                onClick={openAddModal}
                className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-extrabold shadow-sm transition flex items-center gap-1.5"
              >
                <Icon name="plus" className="w-4 h-4" />
                Tambah Produk
              </button>
            </div>
          </div>

          {/* FILTER & SEARCH CONTROLS */}
          <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-wrap items-center justify-between gap-3 text-xs">
            {/* SEARCH */}
            <div className="relative flex-1 min-w-[200px]">
              <Icon name="search" className="w-4 h-4 absolute left-3.5 top-2.5 text-slate-400" />
              <input
                type="text"
                placeholder="Cari nama, SKU, atau barcode..."
                value={search}
                onChange={e => setSearch(e.target.value)}
                className="w-full pl-9 pr-3 py-1.5 border border-slate-200 rounded-xl text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-hidden"
              />
            </div>

            {/* CATEGORY FILTER */}
            <select
              value={selectedCat}
              onChange={e => setSelectedCat(e.target.value)}
              className="px-3 py-1.5 border border-slate-200 rounded-xl bg-white font-medium text-slate-700 focus:outline-hidden"
            >
              <option value="all">Semua Kategori</option>
              {categories.map(c => (
                <option key={c.id} value={c.id}>{c.name}</option>
              ))}
            </select>

            {/* STOCK STATUS FILTER */}
            <select
              value={stockFilter}
              onChange={e => setStockFilter(e.target.value)}
              className="px-3 py-1.5 border border-slate-200 rounded-xl bg-white font-medium text-slate-700 focus:outline-hidden"
            >
              <option value="all">Semua Status Stok</option>
              <option value="safe">Stok Aman (&gt; Min)</option>
              <option value="low">Stok Menipis (&le; Min)</option>
              <option value="empty">Stok Habis (0)</option>
              <option value="archived">Diarsipkan</option>
            </select>

            {/* SORTING */}
            <select
              value={sortBy}
              onChange={e => setSortBy(e.target.value)}
              className="px-3 py-1.5 border border-slate-200 rounded-xl bg-white font-medium text-slate-700 focus:outline-hidden"
            >
              <option value="name-asc">Nama (A &rarr; Z)</option>
              <option value="name-desc">Nama (Z &rarr; A)</option>
              <option value="stock-asc">Stok Terendah</option>
              <option value="stock-desc">Stok Tertinggi</option>
              <option value="price-asc">Harga Termurah</option>
              <option value="price-desc">Harga Termahal</option>
            </select>
          </div>

          {/* PRODUCTS TABLE */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead>
                  <tr className="border-b border-slate-200 text-slate-500 font-bold uppercase tracking-wider bg-slate-50">
                    <th className="py-3 px-3.5">SKU & Barcode</th>
                    <th className="py-3 px-3.5">Nama Produk</th>
                    <th className="py-3 px-3.5">Kategori</th>
                    <th className="py-3 px-3.5">Harga Modal</th>
                    <th className="py-3 px-3.5">Harga Jual</th>
                    <th className="py-3 px-3.5">Stok / Min</th>
                    <th className="py-3 px-3.5">Status</th>
                    <th className="py-3 px-3.5">Pemasok</th>
                    <th className="py-3 px-3.5 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {filteredProducts.map(p => {
                    const isOut = p.stock === 0;
                    const isLow = p.stock > 0 && p.stock <= p.minStock;

                    return (
                      <tr key={p.id} className="hover:bg-slate-50/80 transition">
                        <td className="py-3 px-3.5">
                          <p className="font-bold text-slate-800">{p.sku}</p>
                          {p.barcode && <p className="text-[10px] text-slate-400 font-mono">{p.barcode}</p>}
                        </td>
                        <td className="py-3 px-3.5">
                          <p className="font-bold text-slate-800">{p.name}</p>
                          <p className="text-[10px] text-slate-400">Satuan: {p.unit}</p>
                        </td>
                        <td className="py-3 px-3.5 text-slate-600 font-medium">{categoryMap[p.categoryId] || '-'}</td>
                        <td className="py-3 px-3.5 text-slate-600">{formatRp(p.costPrice)}</td>
                        <td className="py-3 px-3.5 font-bold text-emerald-600">{formatRp(p.sellingPrice)}</td>
                        <td className="py-3 px-3.5">
                          <span className="font-extrabold text-slate-800">{p.stock}</span>
                          <span className="text-slate-400 text-[10px]"> / min {p.minStock} {p.unit}</span>
                        </td>
                        <td className="py-3 px-3.5">
                          {p.isArchived ? (
                            <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-200 text-slate-600">
                              Diarsipkan
                            </span>
                          ) : isOut ? (
                            <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-800">
                              Habis
                            </span>
                          ) : isLow ? (
                            <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800">
                              Menipis
                            </span>
                          ) : (
                            <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">
                              Aman
                            </span>
                          )}
                        </td>
                        <td className="py-3 px-3.5 text-slate-500 truncate max-w-[140px]">
                          {supplierMap[p.supplierId] || '-'}
                        </td>
                        <td className="py-3 px-3.5 text-right space-x-1">
                          <button
                            onClick={() => openEditModal(p)}
                            className="p-1.5 text-slate-600 hover:text-emerald-600 hover:bg-emerald-50 rounded-lg transition"
                            title="Edit Produk"
                          >
                            <Icon name="edit" className="w-4 h-4" />
                          </button>
                          <button
                            onClick={() => setDeleteModal(p)}
                            className="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition"
                            title="Hapus / Arsipkan"
                          >
                            <Icon name="trash" className="w-4 h-4" />
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                  {filteredProducts.length === 0 && (
                    <tr>
                      <td colSpan="9" className="py-12 text-center text-slate-400">
                        Tidak ada data produk yang cocok dengan pencarian / filter.
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
            <div className="p-3 bg-slate-50 border-t border-slate-100 text-xs text-slate-500 flex justify-between items-center">
              <span>Menampilkan {filteredProducts.length} dari {products.length} produk terdaftar</span>
              <span className="font-medium text-emerald-700">WarungStock System</span>
            </div>
          </div>

          {/* ADD / EDIT PRODUCT MODAL */}
          {modalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto border border-slate-200">
                <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                  <h3 className="font-bold text-sm text-slate-800">
                    {editingProduct ? 'Edit Data Produk' : 'Tambah Produk Baru'}
                  </h3>
                  <button onClick={() => setModalOpen(false)} className="p-1 text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleSaveProduct} className="p-5 space-y-3.5 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Kode SKU (Unik) *</label>
                      <input
                        type="text"
                        required
                        value={formData.sku}
                        onChange={e => setFormData({ ...formData, sku: e.target.value })}
                        className="w-full px-3 py-2 border border-slate-300 rounded-xl font-bold uppercase focus:ring-1 focus:ring-emerald-500 focus:outline-hidden"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Barcode (Opsional)</label>
                      <input
                        type="text"
                        value={formData.barcode}
                        onChange={e => setFormData({ ...formData, barcode: e.target.value })}
                        placeholder="Contoh: 899..."
                        className="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-1 focus:ring-emerald-500 focus:outline-hidden"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Nama Produk *</label>
                    <input
                      type="text"
                      required
                      value={formData.name}
                      onChange={e => setFormData({ ...formData, name: e.target.value })}
                      placeholder="Contoh: Indomie Goreng Original 85g"
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-1 focus:ring-emerald-500 focus:outline-hidden"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Kategori *</label>
                      <select
                        required
                        value={formData.categoryId}
                        onChange={e => setFormData({ ...formData, categoryId: e.target.value })}
                        className="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white focus:outline-hidden"
                      >
                        {categories.map(c => (
                          <option key={c.id} value={c.id}>{c.name}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Satuan Kemasan *</label>
                      <select
                        required
                        value={formData.unit}
                        onChange={e => setFormData({ ...formData, unit: e.target.value })}
                        className="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white focus:outline-hidden"
                      >
                        {['pcs', 'bungkus', 'botol', 'kaleng', 'renteng', 'pak', 'dus'].map(u => (
                          <option key={u} value={u}>{u}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Harga Beli / Modal (Rp) *</label>
                      <input
                        type="number"
                        min="0"
                        required
                        value={formData.costPrice}

    // ==========================================
    // 4. CATEGORIES VIEW COMPONENT
    // ==========================================
    function CategoriesView({ categories, setCategories, products, showToast }) {
      const [modalOpen, setModalOpen] = useState(false);
      const [editingCat, setEditingCat] = useState(null);
      const [name, setName] = useState('');
      const [desc, setDesc] = useState('');

      const openAdd = () => {
        setEditingCat(null);
        setName('');
        setDesc('');
        setModalOpen(true);
      };

      const openEdit = (c) => {
        setEditingCat(c);
        setName(c.name);
        setDesc(c.description || '');
        setModalOpen(true);
      };

      const handleSave = (e) => {
        e.preventDefault();
        const trimmed = name.trim();
        if (!trimmed) {
          showToast('Nama kategori wajib diisi!', 'error');
          return;
        }

        const duplicate = categories.find(c =>
          c.name.toLowerCase() === trimmed.toLowerCase() &&
          (!editingCat || c.id !== editingCat.id)
        );
        if (duplicate) {
          showToast(`Kategori "${trimmed}" sudah ada!`, 'error');
          return;
        }

        if (editingCat) {
          setCategories(categories.map(c => c.id === editingCat.id ? { ...c, name: trimmed, description: desc.trim() } : c));
          showToast(`Kategori "${trimmed}" berhasil diperbarui.`);
        } else {
          setCategories([...categories, {
            id: 'cat-' + Date.now(),
            name: trimmed,
            description: desc.trim(),
            createdAt: new Date().toISOString(),
          }]);
          showToast(`Kategori baru "${trimmed}" berhasil ditambahkan.`);
        }
        setModalOpen(false);
      };

      const handleDelete = (id, catName) => {
        const inUse = products.some(p => p.categoryId === id && !p.isArchived);
        if (inUse) {
          showToast(`Kategori "${catName}" masih digunakan oleh produk aktif! Pindahkan kategori produk terlebih dahulu.`, 'error');
          return;
        }

        if (confirm(`Apakah Anda yakin ingin menghapus kategori "${catName}"?`)) {
          setCategories(categories.filter(c => c.id !== id));
          showToast(`Kategori "${catName}" berhasil dihapus.`);
        }
      };

      return (
        <div className="space-y-5">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
            <div>
              <h2 className="text-xl font-extrabold text-slate-800 tracking-tight">Manajemen Kategori Barang</h2>
              <p className="text-xs text-slate-500 mt-0.5">Klasifikasikan produk warung untuk mempermudah pencarian di kasir dan analisis laporan.</p>
            </div>
            <button
              onClick={openAdd}
              className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-extrabold shadow-sm transition flex items-center gap-1.5"
            >
              <Icon name="plus" className="w-4 h-4" />
              Tambah Kategori
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {categories.map(c => {
              const count = products.filter(p => p.categoryId === c.id && !p.isArchived).length;
              return (
                <div key={c.id} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex flex-col justify-between hover:border-emerald-400 transition">
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <span className="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-800 border border-emerald-200">
                        {count} Produk
                      </span>
                      <div className="space-x-1">
                        <button
                          onClick={() => openEdit(c)}
                          className="p-1 text-slate-400 hover:text-emerald-600 rounded transition"
                        >
                          <Icon name="edit" className="w-4 h-4" />
                        </button>
                        <button
                          onClick={() => handleDelete(c.id, c.name)}
                          className="p-1 text-slate-400 hover:text-rose-600 rounded transition"
                        >
                          <Icon name="trash" className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                    <h3 className="font-bold text-slate-800 text-sm mb-1">{c.name}</h3>
                    <p className="text-xs text-slate-500 leading-relaxed">{c.description || 'Tidak ada keterangan tambahan.'}</p>
                  </div>
                </div>
              );
            })}
          </div>

          {modalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-5 border border-slate-200">
                <div className="flex items-center justify-between mb-4 border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-slate-800 text-sm">
                    {editingCat ? 'Edit Kategori' : 'Tambah Kategori Baru'}
                  </h3>
                  <button onClick={() => setModalOpen(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleSave} className="space-y-3.5 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Nama Kategori *</label>
                    <input
                      type="text"
                      required
                      placeholder="Contoh: Sembako, Minuman..."
                      value={name}
                      onChange={e => setName(e.target.value)}
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-1 focus:ring-emerald-500 focus:outline-hidden"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Keterangan (Opsional)</label>
                    <textarea
                      rows="3"
                      placeholder="Deskripsi singkat jenis barang..."
                      value={desc}
                      onChange={e => setDesc(e.target.value)}
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-1 focus:ring-emerald-500 focus:outline-hidden"
                    />
                  </div>
                  <div className="pt-3 border-t border-slate-100 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setModalOpen(false)}
                      className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-sm"
                    >
                      Simpan Kategori
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 5. PURCHASES (KULAKAN) VIEW COMPONENT
    // ==========================================
    function PurchasesView({ purchases, setPurchases, products, setProducts, suppliers, movements, setMovements, currentUser, showToast }) {
      const [modalOpen, setModalOpen] = useState(false);
      const [detailModal, setDetailModal] = useState(null);
      const [cancelModal, setCancelModal] = useState(null);
      const [cancelReason, setCancelReason] = useState('');

      // New PO Form state
      const [supplierId, setSupplierId] = useState(suppliers[0]?.id || '');
      const [poStatus, setPoStatus] = useState('completed'); // draft or completed
      const [notes, setNotes] = useState('');
      const [poItems, setPoItems] = useState([
        { productId: products[0]?.id || '', quantity: 10, costPrice: products[0]?.costPrice || 2000 }
      ]);

      const activeProducts = products.filter(p => !p.isArchived);

      const addItemRow = () => {
        setPoItems([...poItems, {
          productId: activeProducts[0]?.id || '',
          quantity: 10,
          costPrice: activeProducts[0]?.costPrice || 2000,
        }]);
      };

      const removeItemRow = (idx) => {
        if (poItems.length === 1) return;
        setPoItems(poItems.filter((_, i) => i !== idx));
      };

      const updateItemRow = (idx, field, val) => {
        setPoItems(poItems.map((item, i) => {
          if (i === idx) {
            const updated = { ...item, [field]: val };
            if (field === 'productId') {
              const p = activeProducts.find(prod => prod.id === val);
              if (p) updated.costPrice = p.costPrice;
            }
            return updated;
          }
          return item;
        }));
      };

      const totalPoAmount = poItems.reduce((acc, item) => acc + ((Number(item.quantity) || 0) * (Number(item.costPrice) || 0)), 0);

      const handleSavePurchase = (e) => {
        e.preventDefault();
        if (!supplierId) {
          showToast('Pilih pemasok terlebih dahulu!', 'error');
          return;
        }

        const sup = suppliers.find(s => s.id === supplierId);
        const now = new Date();
        const dateStr = now.toISOString();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const purchaseNumber = `PO-${yyyy}${mm}${dd}-${Math.floor(1000 + Math.random() * 9000)}`;

        const shouldAddStock = poStatus === 'completed';

        // Prepare item objects
        const purchaseItems = poItems.map(item => {
          const prod = products.find(p => p.id === item.productId);
          const qty = Number(item.quantity) || 1;
          const cost = Number(item.costPrice) || 0;
          return {
            productId: item.productId,
            productName: prod ? prod.name : 'Produk',
            sku: prod ? prod.sku : '-',
            unit: prod ? prod.unit : 'pcs',
            quantity: qty,
            costPrice: cost,
            subtotal: qty * cost,
          };
        });

        if (shouldAddStock) {
          // Increment stock safely
          const updatedProducts = products.map(p => {
            const poItem = purchaseItems.find(pi => pi.productId === p.id);
            if (poItem) {
              return {
                ...p,
                stock: p.stock + poItem.quantity,
                costPrice: poItem.costPrice, // Update to current purchase cost
                updatedAt: dateStr,
              };
            }
            return p;
          });

          const newMovements = purchaseItems.map(item => {
            const p = products.find(prod => prod.id === item.productId);
            return {
              id: 'mov-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
              date: dateStr,
              productId: item.productId,
              productName: item.productName,
              sku: item.sku,
              stockBefore: p ? p.stock : 0,
              change: item.quantity,
              stockAfter: (p ? p.stock : 0) + item.quantity,
              type: 'purchase',
              typeLabel: 'Pembelian Masuk',
              referenceNumber: purchaseNumber,
              notes: `Penerimaan Kulakan dari ${sup?.company || sup?.name}`,
              userName: currentUser.name,
            };
          });

          setProducts(updatedProducts);
          setMovements([...newMovements, ...movements]);
        }

        const newPurchase = {
          id: 'po-' + Date.now(),
          purchaseNumber,
          date: dateStr,
          supplierId,
          supplierName: sup ? (sup.company || sup.name) : 'Pemasok',
          items: purchaseItems,
          totalAmount: totalPoAmount,
          status: poStatus,
          notes: notes.trim(),
          stockUpdated: shouldAddStock,
          createdAt: dateStr,
        };

        setPurchases([newPurchase, ...purchases]);
        setModalOpen(false);
        setNotes('');
        showToast(shouldAddStock ? `Kulakan ${purchaseNumber} berhasil disimpan dan stok telah bertambah!` : `Draft kulakan ${purchaseNumber} berhasil disimpan.`);
      };

      // Mark Draft as Completed (Idempotent Stock Addition)
      const handleCompletePo = (po) => {
        if (po.stockUpdated || po.status === 'completed') {
          showToast('Pembelian ini sudah selesai! Tidak ada perubahan stok ganda.', 'error');
          return;
        }

        const now = new Date().toISOString();

        // Increment stock
        const updatedProducts = products.map(p => {
          const item = po.items.find(pi => pi.productId === p.id);
          if (item) {
            return {
              ...p,
              stock: p.stock + item.quantity,
              costPrice: item.costPrice,
              updatedAt: now,
            };
          }
          return p;
        });

        // Record movements
        const newMovements = po.items.map(item => {
          const p = products.find(prod => prod.id === item.productId);
          return {
            id: 'mov-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
            date: now,
            productId: item.productId,
            productName: item.productName,
            sku: item.sku,
            stockBefore: p ? p.stock : 0,
            change: item.quantity,
            stockAfter: (p ? p.stock : 0) + item.quantity,
            type: 'purchase',
            typeLabel: 'Penerimaan Kulakan',
            referenceNumber: po.purchaseNumber,
            notes: `Penyelesaian status PO ${po.purchaseNumber}`,
            userName: currentUser.name,
          };
        });

        // Update purchase record
        const updatedPurchases = purchases.map(p => {
          if (p.id === po.id) {
            return { ...p, status: 'completed', stockUpdated: true };
          }
          return p;
        });

        setProducts(updatedProducts);
        setMovements([...newMovements, ...movements]);
        setPurchases(updatedPurchases);
        showToast(`PO ${po.purchaseNumber} diselesaikan dan stok telah masuk!`);
      };

      // Cancel Purchase with Stock Reversal
      const handleConfirmCancelPo = () => {
        if (!cancelModal) return;
        if (!cancelReason.trim()) {
          showToast('Alasan pembatalan kulakan wajib diisi!', 'error');
          return;
        }

        const po = cancelModal;
        const now = new Date().toISOString();

        if (po.stockUpdated) {
          // Revert stock back
          const updatedProducts = products.map(p => {
            const item = po.items.find(pi => pi.productId === p.id);
            if (item) {
              return {
                ...p,
                stock: Math.max(0, p.stock - item.quantity),
                updatedAt: now,
              };
            }
            return p;
          });

          const revertMovements = po.items.map(item => {
            const p = products.find(prod => prod.id === item.productId);
            return {
              id: 'mov-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
              date: now,
              productId: item.productId,
              productName: item.productName,
              sku: item.sku,
              stockBefore: p ? p.stock : 0,
              change: -item.quantity,
              stockAfter: Math.max(0, (p ? p.stock : 0) - item.quantity),
              type: 'purchase_cancellation',
              typeLabel: 'Pembatalan Pembelian',
              referenceNumber: po.purchaseNumber,
              notes: `Batal kulakan ${po.purchaseNumber}: ${cancelReason.trim()}`,
              userName: currentUser.name,
            };
          });

          setProducts(updatedProducts);
          setMovements([...revertMovements, ...movements]);
        }

        const updatedPurchases = purchases.map(p => {
          if (p.id === po.id) {
            return {
              ...p,
              status: 'cancelled',
              cancellationReason: cancelReason.trim(),
              cancelledAt: now,
              stockUpdated: false,
            };
          }
          return p;
        });

        setPurchases(updatedPurchases);
        setCancelModal(null);
        setCancelReason('');
        showToast(`PO ${po.purchaseNumber} berhasil dibatalkan.`);
      };

      return (
        <div className="space-y-5">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
            <div>
              <h2 className="text-xl font-extrabold text-slate-800 tracking-tight">Manajemen Pembelian (Kulakan)</h2>
              <p className="text-xs text-slate-500 mt-0.5">Catat pasokan barang dari agen, pantau harga modal historis, dan restok otomatis ke etalase.</p>
            </div>
            <button
              onClick={() => setModalOpen(true)}
              className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-extrabold shadow-sm transition flex items-center gap-1.5"
            >
              <Icon name="plus" className="w-4 h-4" />
              Catat Kulakan Baru
            </button>
          </div>

          {/* PURCHASES TABLE */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead>
                  <tr className="border-b border-slate-200 text-slate-500 font-bold uppercase tracking-wider bg-slate-50">
                    <th className="py-3 px-3.5">No. Pembelian</th>
                    <th className="py-3 px-3.5">Tanggal</th>
                    <th className="py-3 px-3.5">Pemasok / Agen</th>
                    <th className="py-3 px-3.5">Jumlah Item</th>
                    <th className="py-3 px-3.5">Total Biaya Kulakan</th>
                    <th className="py-3 px-3.5">Status</th>
                    <th className="py-3 px-3.5 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">

    function SuppliersView({ suppliers, setSuppliers, products, showToast }) {
      const [modalOpen, setModalOpen] = useState(false);
      const [editingSup, setEditingSup] = useState(null);
      const [search, setSearch] = useState('');

      const [formData, setFormData] = useState({
        name: '',
        company: '',
        phone: '',
        address: '',
        suppliedProducts: '',
        notes: '',
      });

      const filteredSuppliers = suppliers.filter(s => {
        if (s.isArchived) return false;
        const q = search.toLowerCase().trim();
        if (!q) return true;
        return (
          s.name.toLowerCase().includes(q) ||
          s.company.toLowerCase().includes(q) ||
          s.phone.includes(q) ||
          s.suppliedProducts.toLowerCase().includes(q)
        );
      });

      const openAdd = () => {
        setEditingSup(null);
        setFormData({
          name: '',
          company: '',
          phone: '',
          address: '',
          suppliedProducts: '',
          notes: '',
        });
        setModalOpen(true);
      };

      const openEdit = (s) => {
        setEditingSup(s);
        setFormData({
          name: s.name,
          company: s.company,
          phone: s.phone,
          address: s.address,
          suppliedProducts: s.suppliedProducts,
          notes: s.notes || '',
        });
        setModalOpen(true);
      };

      const handleSave = (e) => {
        e.preventDefault();
        if (!formData.name.trim() || !formData.company.trim() || !formData.phone.trim()) {
          showToast('Nama kontak, nama toko/agen, dan nomor telepon wajib diisi!', 'error');
          return;
        }

        if (editingSup) {
          setSuppliers(suppliers.map(s => s.id === editingSup.id ? { ...s, ...formData } : s));
          showToast(`Data pemasok "${formData.company}" berhasil diperbarui.`);
        } else {
          setSuppliers([...suppliers, {
            ...formData,
            id: 'sup-' + Date.now(),
            isArchived: false,
            createdAt: new Date().toISOString(),
          }]);
          showToast(`Pemasok baru "${formData.company}" berhasil ditambahkan.`);
        }
        setModalOpen(false);
      };

      const handleArchive = (s) => {
        if (confirm(`Apakah Anda yakin ingin mengarsipkan data pemasok "${s.company || s.name}"?`)) {
          setSuppliers(suppliers.map(item => item.id === s.id ? { ...item, isArchived: true } : item));

              <Icon name="plus" className="w-4 h-4" />
              Tambah Pemasok
            </button>
          </div>

          <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
            <div className="relative max-w-sm">
              <Icon name="search" className="w-4 h-4 absolute left-3.5 top-2.5 text-slate-400" />
              <input
                type="text"

                <div key={s.id} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex flex-col justify-between hover:border-emerald-400 transition">
                  <div className="space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="font-black text-sm text-slate-800">{s.company}</span>
                      <div className="space-x-1">
                        <button

                          <Icon name="edit" className="w-4 h-4" />

                        <button

                  <button onClick={() => setModalOpen(false)} className="text-slate-400 hover:text-slate-600">

                  </button>
                </div>

                <form onSubmit={handleSave} className="space-y-3.5 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Nama Perusahaan / Toko *</label>
                      <input

                  <div className="grid grid-cols-2 gap-3">

                        className="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-hidden"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Produk yang Dipasok</label>
                      <input
                        type="text"
                        placeholder="Contoh: Sembako, Minuman..."
                        value={formData.suppliedProducts}

                    <label className="block font-bold text-slate-700 mb-1">Alamat Pemasok</label>

    // ==========================================
    // 7. STOCK OPNAME VIEW COMPONENT
    // ==========================================
    function StockOpnameView({ products, setProducts, opnames, setOpnames, movements, setMovements, currentUser, showToast }) {
      const activeProducts = products.filter(p => !p.isArchived);
      const [selectedProdId, setSelectedProdId] = useState(activeProducts[0]?.id || '');
      const [physicalStock, setPhysicalStock] = useState('');
      const [reason, setReason] = useState('selisih_hitung');
      const [notes, setNotes] = useState('');

      const selectedProduct = activeProducts.find(p => p.id === selectedProdId);
      const systemStock = selectedProduct ? selectedProduct.stock : 0;
      const physicalNum = physicalStock === '' ? systemStock : Number(physicalStock);
      const discrepancy = physicalNum - systemStock;

      const reasonLabels = {
        rusak: 'Barang Rusak',
        kedaluwarsa: 'Barang Kedaluwarsa',
        hilang: 'Barang Hilang / Kurang',
        selisih_hitung: 'Selisih Hasil Perhitungan Fisik',
        koreksi_pencatatan: 'Koreksi Kesalahan Input',
      };

      const handleSaveOpname = (e) => {
        e.preventDefault();
        if (!selectedProduct) {
          showToast('Pilih produk terlebih dahulu!', 'error');
          return;
        }

        if (physicalNum < 0) {
          showToast('Jumlah fisik tidak boleh bernilai negatif!', 'error');
          return;
        }

        if (discrepancy === 0) {
          showToast('Jumlah fisik sama dengan stok catatan sistem, penyesuaian tidak diperlukan.', 'warning');
          return;
        }

        const now = new Date();
        const dateStr = now.toISOString();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const opnameNumber = `OPN-${yyyy}${mm}${dd}-${Math.floor(1000 + Math.random() * 9000)}`;

        // Update product stock
        const updatedProducts = products.map(p => {
          if (p.id === selectedProduct.id) {
            return { ...p, stock: physicalNum, updatedAt: dateStr };
          }
          return p;
        });

        // Record stock movement
        const newMovement = {
          id: 'mov-' + Date.now(),
          date: dateStr,
          productId: selectedProduct.id,
          productName: selectedProduct.name,
          sku: selectedProduct.sku,
          stockBefore: systemStock,
          change: discrepancy,
          stockAfter: physicalNum,
          type: 'adjustment',
          typeLabel: `Stock Opname (${reasonLabels[reason]})`,
          referenceNumber: opnameNumber,
          notes: notes.trim() || `Penyesuaian stock opname: ${reasonLabels[reason]}`,
          userName: currentUser.name,

        // Record opname

          date: dateStr,
          productId: selectedProduct.id,
          productName: selectedProduct.name,

          unit: selectedProduct.unit,
          systemStock,
          physicalStock: physicalNum,
          discrepancy,
          reason,
          reasonLabel: reasonLabels[reason],
          notes: notes.trim(),
          adjustedBy: currentUser.name,
        };

        setProducts(updatedProducts);
        setMovements([newMovement, ...movements]);
        setOpnames([newOpname, ...opnames]);

        setPhysicalStock('');
        setNotes('');
        showToast(`Penyesuaian stok untuk "${selectedProduct.name}" berhasil disimpan (Selisih: ${discrepancy > 0 ? '+' : ''}${discrepancy} ${selectedProduct.unit}).`);
      };

      return (

    // ==========================================
    // 9. REPORTS VIEW COMPONENT
    // ==========================================
    function ReportsView({ sales, purchases, products, categoryMap, opnames }) {
      const [reportTab, setReportTab] = useState('sales'); // sales, purchases, products, inventory
      const [period, setPeriod] = useState('month'); // today, week, month, all, custom
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');

      // Filtered sales
      const filteredSales = useMemo(() => {
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

        return sales.filter(s => {
          if (s.status === 'cancelled') return false;
          const sTime = new Date(s.date).getTime();

          if (period === 'today') return sTime >= startOfToday;
          if (period === 'week') return sTime >= (Date.now() - 7 * 24 * 60 * 60 * 1000);
          if (period === 'month') return sTime >= new Date(now.getFullYear(), now.getMonth(), 1).getTime();
          if (period === 'custom') {
            if (!startDate && !endDate) return true;
            const start = startDate ? new Date(startDate).getTime() : 0;
            const end = endDate ? new Date(endDate + 'T23:59:59').getTime() : Infinity;
            return sTime >= start && sTime <= end;
          }
          return true;
        });
      }, [sales, period, startDate, endDate]);

      // Filtered purchases
      const filteredPurchases = useMemo(() => {
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

        return purchases.filter(p => {
          if (p.status !== 'completed') return false;
          const pTime = new Date(p.date).getTime();

          if (period === 'today') return pTime >= startOfToday;
          if (period === 'week') return pTime >= (Date.now() - 7 * 24 * 60 * 60 * 1000);
          if (period === 'month') return pTime >= new Date(now.getFullYear(), now.getMonth(), 1).getTime();
          if (period === 'custom') {
            if (!startDate && !endDate) return true;
            const start = startDate ? new Date(startDate).getTime() : 0;
            const end = endDate ? new Date(endDate + 'T23:59:59').getTime() : Infinity;
            return pTime >= start && pTime <= end;
          }
          return true;
        });
      }, [purchases, period, startDate, endDate]);

      // Metrics calculation
      const totalRevenue = filteredSales.reduce((acc, s) => acc + s.total, 0);
      const totalHPP = filteredSales.reduce((acc, s) => {
        return acc + s.items.reduce((sum, it) => sum + (it.costPrice * it.quantity), 0);
      }, 0);
      const grossProfit = totalRevenue - totalHPP;
      const profitMargin = totalRevenue > 0 ? Math.round((grossProfit / totalRevenue) * 100) : 0;

      const totalPurchaseCost = filteredPurchases.reduce((acc, p) => acc + p.totalAmount, 0);

      // Product sales analysis
      const productSalesMap = useMemo(() => {
        const map = {};
        products.filter(p => !p.isArchived).forEach(p => {
          map[p.id] = {
            id: p.id,
            name: p.name,
            sku: p.sku,
            unit: p.unit,
            categoryId: p.categoryId,
            currentStock: p.stock,
            soldQty: 0,
            revenue: 0,
            profit: 0,
          };
        });

        filteredSales.forEach(s => {
          s.items.forEach(it => {
            if (map[it.productId]) {
              map[it.productId].soldQty += it.quantity;
              map[it.productId].revenue += it.subtotal;
              map[it.productId].profit += (it.sellingPrice - it.costPrice) * it.quantity;
            }
          });
        });

        return Object.values(map);
      }, [products, filteredSales]);

      const topSelling = [...productSalesMap].sort((a, b) => b.soldQty - a.soldQty);
      const slowMoving = [...productSalesMap].sort((a, b) => a.soldQty - b.soldQty);

      // Inventory valuation
      const activeProducts = products.filter(p => !p.isArchived);
      const totalInventoryValuation = activeProducts.reduce((acc, p) => acc + (p.stock * p.costPrice), 0);
      const totalStockUnits = activeProducts.reduce((acc, p) => acc + p.stock, 0);

      // Export CSV
      const exportReportCsv = () => {
        let headers = [];
        let rows = [];
        let filename = `Laporan_WarungStock_${reportTab}_${new Date().toISOString().split('T')[0]}.csv`;

        if (reportTab === 'sales') {
          headers = ['No. Struk', 'Waktu', 'Kasir', 'Metode Bayar', 'Subtotal', 'Diskon', 'Total Omzet', 'Modal HPP', 'Keuntungan Kotor'];
          rows = filteredSales.map(s => {
            const hpp = s.items.reduce((sum, it) => sum + (it.costPrice * it.quantity), 0);
            return [
              `"${s.invoiceNumber}"`,
              `"${s.date}"`,
              `"${s.cashierName}"`,
              `"${s.paymentMethod}"`,
              s.subtotal,
              s.discount,
              s.total,
              hpp,
              s.total - hpp,
            ];
          });
        } else if (reportTab === 'purchases') {
          headers = ['No. PO', 'Waktu', 'Pemasok', 'Jumlah Item', 'Total Biaya'];
          rows = filteredPurchases.map(p => [
            `"${p.purchaseNumber}"`,
            `"${p.date}"`,
            `"${p.supplierName}"`,
            p.items.reduce((sum, it) => sum + it.quantity, 0),
            p.totalAmount,
          ]);
        } else if (reportTab === 'products') {
          headers = ['SKU', 'Nama Produk', 'Kategori', 'Stok Saat Ini', 'Qty Terjual', 'Omzet Penjualan', 'Keuntungan Kotor'];
          rows = topSelling.map(p => [
            `"${p.sku}"`,
            `"${p.name.replace(/"/g, '""')}"`,
            `"${categoryMap[p.categoryId] || ''}"`,
            p.currentStock,
            p.soldQty,
            p.revenue,
            p.profit,
          ]);
        } else {
          headers = ['SKU', 'Nama Produk', 'Kategori', 'Stok Unit', 'Satuan', 'Harga Modal', 'Total Nilai Persediaan'];
          rows = activeProducts.map(p => [
            `"${p.sku}"`,
            `"${p.name.replace(/"/g, '""')}"`,
            `"${categoryMap[p.categoryId] || ''}"`,
            p.stock,
            `"${p.unit}"`,
            p.costPrice,
            p.stock * p.costPrice,
          ]);
        }

        const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="space-y-6">
          {/* HEADER & CONTROLS */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
            <div>
              <h2 className="text-xl font-extrabold text-slate-800 tracking-tight">Laporan Keuangan & Analisis Warung</h2>
              <p className="text-xs text-slate-500 mt-0.5">Analisis omzet, keuntungan kotor, belanja kulakan, dan perputaran barang dagangan.</p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={exportReportCsv}
                className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-xs"
              >
                <Icon name="download" className="w-4 h-4" />
                Ekspor Laporan CSV
              </button>
            </div>
          </div>

                <button
                  type="submit"
                  className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-sm transition"
                >
                  Simpan Perubahan Pengaturan
                </button>
              </div>
            </form>
          </div>

          {/* DANGER ZONE / DATA RESET */}
          <div className="bg-rose-50/60 p-6 rounded-2xl border border-rose-200 space-y-3">
            <h3 className="font-bold text-sm text-rose-900">Manajemen Pemulihan Data & Pengujian</h3>
            <p className="text-xs text-rose-700 leading-relaxed">
              Gunakan opsi di bawah ini untuk mengatur ulang aplikasi jika Anda sedang melakukan pengujian sistem:
            </p>
            <div className="flex flex-wrap gap-3 pt-2">
              <button
                type="button"
                onClick={onResetDemo}
                className="px-4 py-2 bg-white border border-rose-300 hover:bg-rose-100 text-rose-800 rounded-xl text-xs font-bold transition shadow-xs"
              >
                Reset Kembali ke Data Demo Warung
              </button>
              <button
                type="button"
                onClick={handleClearTransactions}
                className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition shadow-xs"
              >
                Kosongkan Semua Transaksi (Mulai Usaha Baru)
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Export root component
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
